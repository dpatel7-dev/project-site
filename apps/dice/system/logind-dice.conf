# DiceOS: the power button on an air mouse, a media keyboard or the computer itself
# shouldn't switch everything off with one bump. diced catches the press instead and
# DiceOS sleeps (or asks, as you choose in Settings > Remotes). Holding the button down
# for 5 seconds still shuts the computer down.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
HandleSuspendKey=ignore
HandleHibernateKey=ignore
