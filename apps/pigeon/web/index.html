<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eaf1f8">
<title>pigeon</title>
<link rel="icon" id="icon" href="data:,">
<style>
:root {
  --bg: #e9f0f7; --ink: #162033; --dim: #5d6a80; --faint: #98a3b5;
  --glass: rgba(255, 255, 255, .62); --glass-2: rgba(255, 255, 255, .82); --edge: rgba(255, 255, 255, .85); --line: rgba(22, 32, 51, .09);
  --hover: rgba(22, 32, 51, .055); --sel: rgba(15, 154, 139, .14); --sel-edge: rgba(15, 154, 139, .55);
  --teal: #0f9a8b; --teal-2: #24c2b0; --violet: #6d4fe0; --coral: #ff7a3d; --sun: #f2b33d; --rose: #e2496a; --ok: #12935a;
  --blob-a: #7fe0d2; --blob-b: #b9a6ff; --blob-c: #ffc9a8;
  --shadow: 0 1px 0 rgba(255, 255, 255, .7) inset, 0 12px 40px -18px rgba(22, 32, 51, .35);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
:root[data-theme=dark] {
  --bg: #0b1017; --ink: #e7edf6; --dim: #94a1b6; --faint: #5b6679;
  --glass: rgba(24, 31, 43, .62); --glass-2: rgba(30, 38, 52, .9); --edge: rgba(255, 255, 255, .09); --line: rgba(255, 255, 255, .08);
  --hover: rgba(255, 255, 255, .06); --sel: rgba(36, 194, 176, .16); --sel-edge: rgba(36, 194, 176, .6);
  --teal: #2bc4b2; --violet: #9b82ff; --coral: #ff9a5c; --ok: #3ccf8a; --rose: #ff6b88;
  --blob-a: #0f6e66; --blob-b: #4a3a9e; --blob-c: #7a3f2a;
  --shadow: 0 1px 0 rgba(255, 255, 255, .06) inset, 0 16px 44px -20px rgba(0, 0, 0, .7);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--violet); }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
[hidden] { display: none !important; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* the sky behind the glass: three slow colour clouds */
.sky { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
.sky i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; }
.sky i:nth-child(1) { width: 46vw; height: 46vw; left: -10vw; top: -14vw; background: var(--blob-a); }
.sky i:nth-child(2) { width: 40vw; height: 40vw; right: -8vw; top: 18vh; background: var(--blob-b); }
.sky i:nth-child(3) { width: 34vw; height: 34vw; left: 30vw; bottom: -16vw; background: var(--blob-c); opacity: .4; }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(26px) saturate(1.7); backdrop-filter: blur(26px) saturate(1.7); border: 1px solid var(--edge); box-shadow: var(--shadow); }

/* ── buttons ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 11px; padding: 10px 16px; font-weight: 600; background: var(--hover); color: var(--ink); text-decoration: none; }
.btn:hover { background: var(--line); }
.btn.primary { background: linear-gradient(135deg, var(--teal), #0b8577); color: #fff; box-shadow: 0 8px 20px -10px var(--teal); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.violet { background: linear-gradient(135deg, var(--violet), #5639c9); color: #fff; }
.btn.danger { color: var(--rose); }
.btn:disabled { opacity: .55; cursor: default; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 10px; background: none; color: var(--dim); }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn[aria-pressed=true] { background: var(--hover); color: var(--ink); }

/* ── login + share ── */
.center { display: grid; place-items: center; padding: 28px 16px; overflow: auto; height: calc(100% - var(--site-nav, 0px)); }
.card { width: min(440px, 100%); border-radius: 24px; padding: 30px 28px 24px; position: relative; overflow: hidden; }
.card::before { content: ""; position: absolute; inset: 0 0 auto; height: 6px; background: repeating-linear-gradient(-45deg, var(--teal) 0 10px, transparent 10px 16px, var(--violet) 16px 26px, transparent 26px 32px); opacity: .85; }
.hello { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.hello canvas { width: 60px; height: 48px; image-rendering: pixelated; }
.hello b { font-size: 1.6rem; letter-spacing: -.02em; display: block; line-height: 1.1; }
.hello span { color: var(--dim); font-size: .92rem; }
.seg { display: flex; padding: 4px; border-radius: 13px; background: var(--hover); margin-bottom: 18px; }
.seg button { flex: 1; border: 0; background: none; padding: 9px 10px; border-radius: 10px; font-weight: 600; color: var(--dim); }
.seg button[aria-pressed=true] { background: var(--glass-2); color: var(--ink); box-shadow: 0 2px 8px -4px rgba(0, 0, 0, .25); }
.field { display: block; margin-bottom: 14px; }
.field span { display: block; font-size: .82rem; font-weight: 600; color: var(--dim); margin-bottom: 6px; }
.field small { display: block; font-size: .8rem; color: var(--faint); margin-top: 5px; }
.field input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass-2); outline: none; }
.field input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--sel); }
.check { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--dim); margin: 4px 0 16px; }
.msg { margin-top: 12px; font-size: .92rem; min-height: 1.3em; color: var(--dim); }
.msg.err { color: var(--rose); }
.msg.ok { color: var(--ok); }
.small { font-size: .85rem; color: var(--dim); }
details.get { margin-top: 18px; font-size: .88rem; color: var(--dim); }
details.get summary { cursor: pointer; font-weight: 600; }
code.cmd { display: block; font: .8rem/1.45 var(--mono); background: var(--hover); padding: 9px 11px; border-radius: 9px; margin: 6px 0 10px; overflow-wrap: anywhere; user-select: all; color: var(--ink); }
.share-preview { display: block; max-width: 100%; max-height: 50vh; border-radius: 14px; margin: 14px auto 0; }

/* ── the app ── */
.app { height: calc(100% - var(--site-nav, 0px)); display: grid; grid-template-columns: 236px minmax(0, 1fr); grid-template-rows: auto 1fr; gap: 12px; padding: 12px; }
.topbar { grid-column: 1 / -1; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 8px 10px 8px 14px; border-radius: 18px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; letter-spacing: -.01em; width: 210px; flex: none; }
.brand canvas { width: 40px; height: 32px; image-rendering: pixelated; }
.search { flex: 1; min-width: 0; max-width: 640px; display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 42px; border-radius: 13px; background: var(--hover); color: var(--dim); }
.search input { flex: 1; border: 0; background: none; outline: none; height: 100%; color: var(--ink); min-width: 0; }
.search:focus-within { background: var(--glass-2); box-shadow: 0 0 0 2px var(--sel-edge); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.me { display: flex; align-items: center; gap: 9px; padding: 5px 10px 5px 5px; border-radius: 12px; border: 0; background: none; }
.me:hover { background: var(--hover); }
.avatar { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--violet), var(--teal)); }

.side { border-radius: 20px; padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
.new { display: flex; align-items: center; gap: 10px; padding: 13px 18px; margin: 0 4px 12px; border-radius: 15px; border: 0; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--teal), var(--violet)); box-shadow: 0 10px 24px -12px var(--violet); width: max-content; }
.new:hover { filter: brightness(1.07); }
.nav { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-radius: 12px; border: 0; background: none; color: var(--dim); font-weight: 550; text-align: left; width: 100%; }
.nav:hover { background: var(--hover); color: var(--ink); }
.nav[aria-current=page] { background: var(--sel); color: var(--ink); }
.nav[aria-current=page] svg { color: var(--teal); }
.nav .count { margin-left: auto; font-size: .75rem; font-weight: 700; color: #fff; background: var(--coral); border-radius: 99px; padding: 1px 7px; }
.nav.drop-target { box-shadow: inset 0 0 0 2px var(--teal); }
.space { margin-top: auto; padding: 14px 12px 4px; font-size: .82rem; color: var(--dim); }
.meter { height: 6px; border-radius: 99px; background: var(--hover); overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--teal), var(--violet), var(--coral)); background-size: 300% 100%; }

.main { border-radius: 20px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.toolbar { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px 20px; min-height: 62px; flex-wrap: wrap; }
.crumbs { display: flex; align-items: center; gap: 2px; font-size: 1.25rem; font-weight: 650; letter-spacing: -.01em; min-width: 0; flex: 1; overflow: hidden; }
.crumbs button { border: 0; background: none; padding: 4px 8px; border-radius: 9px; white-space: nowrap; color: var(--dim); font-weight: 650; }
.crumbs button:last-child { color: var(--ink); }
.crumbs button:hover { background: var(--hover); color: var(--ink); }
.crumbs button.drop-target { box-shadow: inset 0 0 0 2px var(--teal); }
.crumbs .sep { color: var(--faint); }
.selbar { display: flex; align-items: center; gap: 4px; padding: 4px 6px 4px 12px; border-radius: 13px; background: var(--sel); font-size: .9rem; font-weight: 600; }
.view-tools { display: flex; gap: 2px; }
.sortsel { border: 0; background: var(--hover); border-radius: 10px; padding: 8px 10px; color: var(--dim); font-weight: 600; font-size: .85rem; }

.content { flex: 1; overflow: auto; padding: 4px 20px 90px; position: relative; }
.content.dragging::after { content: "Drop to upload here"; position: absolute; inset: 8px 12px; border: 2px dashed var(--teal); border-radius: 18px; display: grid; place-items: center; font-weight: 700; color: var(--teal); background: var(--sel); pointer-events: none; }
.label { font-size: .8rem; font-weight: 700; color: var(--dim); margin: 14px 2px 10px; display: flex; align-items: center; gap: 8px; }
.inbox { margin: 6px 0 4px; padding: 14px 16px; border-radius: 16px; background: linear-gradient(120deg, rgba(255, 122, 61, .14), rgba(109, 79, 224, .12)); border: 1px solid var(--line); }
.inbox h3 { margin: 0 0 8px; font-size: .95rem; display: flex; align-items: center; gap: 8px; }
.inbox .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: .92rem; }
.inbox .row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* folders: little airmail envelopes */
.folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.folder { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass-2); text-align: left; position: relative; overflow: hidden; user-select: none; }
.folder::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: repeating-linear-gradient(-45deg, var(--teal) 0 6px, transparent 6px 9px, var(--violet) 9px 15px, transparent 15px 18px); }
.folder svg { color: var(--teal); }
.folder .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.folder:hover { background: var(--glass); border-color: var(--sel-edge); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
.tile { border-radius: 16px; border: 1px solid var(--line); background: var(--glass-2); overflow: hidden; text-align: left; padding: 0; display: flex; flex-direction: column; position: relative; user-select: none; }
.tile:hover { border-color: var(--sel-edge); }
.thumb { aspect-ratio: 4 / 3; display: grid; place-items: center; background: var(--hover); position: relative; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.stamp { width: 58px; height: 68px; border-radius: 6px; display: grid; place-items: center; font: 700 .78rem var(--mono); color: #fff; letter-spacing: .02em; position: relative; box-shadow: 0 6px 14px -8px rgba(0, 0, 0, .5); }
.stamp::after { content: ""; position: absolute; inset: 3px; border: 1.5px dashed rgba(255, 255, 255, .55); border-radius: 4px; }
.k-img { background: linear-gradient(140deg, #8a5cf6, #6d4fe0); }
.k-vid { background: linear-gradient(140deg, #ff7a3d, #e2496a); }
.k-aud { background: linear-gradient(140deg, #f2b33d, #ff7a3d); }
.k-doc { background: linear-gradient(140deg, #24c2b0, #0f9a8b); }
.k-code { background: linear-gradient(140deg, #3b82f6, #6d4fe0); }
.k-zip { background: linear-gradient(140deg, #8a6a4f, #5f4836); }
.k-file { background: linear-gradient(140deg, #8794a8, #5d6a80); }
.meta { padding: 9px 12px 11px; min-width: 0; }
.meta .nm, .meta .sub { display: block; }
.meta .nm { font-weight: 600; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta .sub { font-size: .78rem; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tick { position: absolute; top: 8px; left: 8px; width: 24px; height: 24px; border-radius: 8px; border: 2px solid rgba(255, 255, 255, .9); background: rgba(0, 0, 0, .18); display: grid; place-items: center; color: #fff; opacity: 0; transition: opacity .12s; }
.tile:hover .tick, .tile.on .tick, .grid.picking .tick { opacity: 1; }
.tile.on, .folder.on, .lrow.on { background: var(--sel); border-color: var(--sel-edge); }
.tile.on .tick { background: var(--teal); border-color: var(--teal); }
.star { position: absolute; top: 8px; right: 8px; color: var(--sun); filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .35)); }
.star svg { fill: currentColor; width: 16px; height: 16px; }
.dropping { box-shadow: 0 0 0 2px var(--teal) inset; }

/* list view */
.list { display: flex; flex-direction: column; }
.lhead, .lrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) 150px 96px 120px 40px; align-items: center; gap: 10px; padding: 0 8px; }
.lhead { font-size: .76rem; font-weight: 700; color: var(--dim); padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.lrow { min-height: 46px; border-radius: 11px; border: 1px solid transparent; background: none; text-align: left; user-select: none; }
.lrow:hover { background: var(--hover); }
.lrow .mini { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font: 700 .52rem var(--mono); color: #fff; overflow: hidden; }
.lrow .mini img { width: 100%; height: 100%; object-fit: cover; }
.lrow .nm { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.lrow .nm svg { width: 14px; height: 14px; color: var(--sun); fill: currentColor; }
.lrow .c { font-size: .85rem; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .where { font-size: .76rem; color: var(--faint); }

.empty { text-align: center; padding: 64px 20px; color: var(--dim); }
.empty canvas { width: 120px; height: 96px; image-rendering: pixelated; margin-bottom: 14px; }
.empty b { display: block; color: var(--ink); font-size: 1.1rem; margin-bottom: 6px; }

/* devices */
.devices { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.device { padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--glass-2); display: flex; flex-direction: column; gap: 10px; }
.device .top { display: flex; align-items: center; gap: 12px; }
.device .dot { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--teal), var(--violet)); flex: none; }
.device .dot.off { background: linear-gradient(135deg, #8794a8, #5d6a80); }
.device b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.device .sub { font-size: .8rem; color: var(--dim); }
.badge { display: inline-block; font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--sel); color: var(--teal); vertical-align: 1px; }
.device .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.device .acts .btn { padding: 8px 12px; font-size: .86rem; }

/* links */
.links .lrow { grid-template-columns: 34px minmax(0, 1fr) 160px 90px auto; }

/* transfers, bottom right like a mail tray */
.transfers { position: fixed; right: 18px; bottom: 18px; width: min(380px, calc(100vw - 36px)); border-radius: 18px; overflow: hidden; z-index: 30; }
.transfers header { display: flex; align-items: center; gap: 10px; padding: 12px 10px 10px 16px; font-weight: 700; }
.transfers header canvas { width: 30px; height: 24px; image-rendering: pixelated; }
.transfers header span { flex: 1; }
.tlist { max-height: 260px; overflow: auto; padding: 0 10px 10px; }
.tr { padding: 8px 8px; border-radius: 11px; font-size: .86rem; }
.tr .l { display: flex; gap: 8px; align-items: center; }
.tr .l b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.tr .l small { color: var(--dim); white-space: nowrap; }
.tr .bar { height: 4px; border-radius: 99px; background: var(--hover); margin-top: 6px; overflow: hidden; }
.tr .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--violet)); border-radius: 99px; transition: width .2s; }
.tr.done .bar i { background: var(--ok); }
.tr.bad .bar i { background: var(--rose); }

/* menus and dialogs */
.menu { position: fixed; z-index: 50; min-width: 220px; padding: 6px; border-radius: 14px; background: var(--glass-2); }
.menu button { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: none; padding: 9px 12px; border-radius: 9px; text-align: left; font-weight: 500; }
.menu button:hover, .menu button:focus-visible { background: var(--hover); outline: none; }
.menu button.danger { color: var(--rose); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
.menu .head { padding: 8px 12px 6px; font-size: .8rem; color: var(--dim); }
dialog { border: 0; padding: 0; background: none; color: inherit; max-width: calc(100vw - 24px); }
dialog::backdrop { background: rgba(10, 14, 22, .38); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.sheet { border-radius: 22px; padding: 22px; width: min(460px, calc(100vw - 24px)); background: var(--glass-2); }
.sheet h3 { margin: 0 0 6px; font-size: 1.15rem; overflow-wrap: anywhere; }
.sheet .sub { color: var(--dim); font-size: .92rem; margin-bottom: 14px; }
.sheet .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.qr { display: block; margin: 6px auto 12px; width: 220px; height: 220px; image-rendering: pixelated; border-radius: 12px; background: #fff; }
.url { font: .78rem/1.4 var(--mono); background: var(--hover); padding: 10px; border-radius: 10px; overflow-wrap: anywhere; user-select: all; }
.tree { max-height: 46vh; overflow: auto; margin: 4px -6px; }
.tree button { display: flex; align-items: center; gap: 9px; width: 100%; border: 0; background: none; padding: 8px 10px; border-radius: 9px; text-align: left; }
.tree button:hover { background: var(--hover); }
.tree button[aria-pressed=true] { background: var(--sel); }
.tree button svg { color: var(--teal); }
.viewer { width: min(1100px, calc(100vw - 24px)); height: min(820px, calc(100vh - 24px)); border-radius: 22px; background: var(--glass-2); display: flex; flex-direction: column; overflow: hidden; }
.viewer header { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 18px; border-bottom: 1px solid var(--line); }
.viewer header b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage { flex: 1; display: grid; place-items: center; overflow: auto; background: rgba(0, 0, 0, .04); position: relative; }
.stage img, .stage video { max-width: 100%; max-height: 100%; }
.stage iframe { width: 100%; height: 100%; border: 0; background: #fff; }
.stage pre { align-self: start; justify-self: stretch; margin: 0; padding: 18px 22px; font: .84rem/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.stage .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 60; padding: 11px 12px 11px 18px; border-radius: 14px; display: flex; align-items: center; gap: 14px; font-weight: 550; background: #172033; color: #fff; box-shadow: 0 14px 40px -14px rgba(0, 0, 0, .6); max-width: calc(100vw - 30px); }
.toast button { border: 0; background: rgba(255, 255, 255, .12); color: #fff; font-weight: 700; padding: 6px 12px; border-radius: 9px; }
.fab, .tabs { display: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); padding: 8px 8px 0; gap: 8px; }
  .search { height: 38px; padding: 0 10px; }
  .view-tools .sortsel { display: none; }
  .side { display: none; }
  .brand { width: auto; }
  .brand span { display: none; }

<script>/*PIGEON_QR*/</script>
<script>
(function () {
  'use strict';
  var C = /*PIGEON_CONFIG*/{};
  var BASE = C.base || '';
  var API = BASE + '/api/';

  var SITE = C.site || (location.origin + BASE);
  var CHUNK = 4 * 1024 * 1024, ITER = 310000, PAR = 3;
  var $ = function (id) { return document.getElementById(id); };

  // ── theme ──
  var theme = (function () { try { return localStorage.getItem('pigeon-theme') || 'auto'; } catch (e) { return 'auto'; } })();

  }
  paintTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme);
  $('themeBtn').onclick = function () {
    theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('pigeon-theme', theme); } catch (e) { /* fine */ }
    paintTheme();
  };

  // ── Coo, drawn from the same pixels as the terminal one ──
  var BIRD = ['....................', '...........GGG......', '..........GGGGG.....', '..........GEKGGB....', '..........GGGGGBB...', '.........NnNGG......', '........NnNnN.......', '...GGGGGNnNnG.......', '..GGWWWWGGGGGG......', '.TGWWWWWWGGGGG......', 'TTGGWWWWWWGGGG......', 'TTTGGGGGGGGGG.......', '...TTGGGGGGG........', '.......F..F.........', '......FF.FF.........', '....................'];
  var INK = { G: '#8f9aab', W: '#c8d0dc', N: '#22b3a2', n: '#8a5cf6', E: '#ff8a3d', K: '#151a22', B: '#4a505c', F: '#ff8a3d', T: '#56606f' };
  function drawBird(cv, grid) {
    var g = cv.getContext('2d');
    g.clearRect(0, 0, cv.width, cv.height);
    grid.forEach(function (row, y) { row.split('').forEach(function (c, x) { if (INK[c]) { g.fillStyle = INK[c]; g.fillRect(x, y, 1, 1); } }); });
  }
  var HOP = BIRD.map(function (r, y) { return y < 13 ? (y === 0 ? '....................' : BIRD[y - 1] || r) : r; });
  document.querySelectorAll('canvas.coo').forEach(function (cv) { drawBird(cv, BIRD); });
  (function favicon() { var cv = document.createElement('canvas'); cv.width = 20; cv.height = 16; drawBird(cv, BIRD); try { $('icon').href = cv.toDataURL(); } catch (e) { /* fine */ } })();
  function hop() { // one small hop when something lands
    var cvs = document.querySelectorAll('canvas.coo');
    cvs.forEach(function (cv) { drawBird(cv, HOP); });
    setTimeout(function () { cvs.forEach(function (cv) { drawBird(cv, BIRD); }); }, 260);
  }

  // ── bytes ──
  function b64(buf) { var s = '', a = new Uint8Array(buf); for (var i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }
  function unb64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }

  function unb64url(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return unb64(s); }
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); }
  function size(n) { var u = ['B', 'KB', 'MB', 'GB']; var i = 0; while (n >= 1024 && i < 3) { n /= 1024; i++; } return (i ? n.toFixed(n < 10 ? 1 : 0) : n) + ' ' + u[i]; }
  function ago(ts) { if (!ts) return ''; var s = (Date.now() - ts) / 1000; if (s < 45) return 'just now'; if (s < 3600) return Math.round(s / 60) + ' min ago'; if (s < 86400) return Math.round(s / 3600) + ' h ago'; if (s < 86400 * 6) return Math.round(s / 86400) + ' d ago'; return new Date(ts).toLocaleDateString(); }

  // ── locking: the same steps as pigeon's src/crypto.js ──
  var S = crypto.subtle;

    return S.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return S.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(salt), iterations: ITER }, k, 512); })
      .then(function (bits) { return { proof: hex(bits.slice(0, 32)), key: new Uint8Array(bits.slice(32, 64)) }; });

    var id = b64(raw);
    if (!keyCache.has(id)) { keyCache.set(id, S.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt'])); if (keyCache.size > 400) keyCache.delete(keyCache.keys().next().value); }
    return keyCache.get(id);

    box = new Uint8Array(box);
    return aes(raw).then(function (k) { return S.decrypt({ name: 'AES-GCM', iv: box.subarray(0, 12), additionalData: enc.encode(aad) }, k, box.subarray(12)); });
  }

  function sealMeta(fk, meta) { return seal(fk, enc.encode(JSON.stringify(meta)), 'pigeon/meta').then(b64); }

  var store = null;
  function remembered() { try { return JSON.parse(localStorage.getItem('pigeon') || sessionStorage.getItem('pigeon') || 'null'); } catch (e) { return null; } }
  function keep(s, forever) {
    if (C.local) return;
    try { localStorage.removeItem('pigeon'); sessionStorage.removeItem('pigeon'); } catch (e) { /* private mode */ }

  }
  function myDid() {
    if (store && store.did) return store.did;
    try { var d = localStorage.getItem('pigeon-did'); if (/^[a-f0-9]{16}$/.test(d || '')) return d; d = hex(crypto.getRandomValues(new Uint8Array(8))); localStorage.setItem('pigeon-did', d); return d; } catch (e) { return hex(crypto.getRandomValues(new Uint8Array(8))); }

      .catch(function (e) { if (e && e.name === 'AbortError') throw e; throw new Error("Couldn't reach pigeon's website. Check your connection."); })

          if (!r.ok) throw new Error(j.error || (r.status >= 500 ? "pigeon's website had a problem (" + r.status + '). Try again in a moment.' : 'The site answered ' + r.status));

    $('shareView').hidden = which !== 'share';
    $('loginView').hidden = which !== 'login';
    $('appView').hidden = which !== 'app';

  }

    }
    var w = []; for (var i = 0; i < Math.min(PAR, o.chunks); i++) w.push(worker());
    return Promise.all(w).then(function () { return new Blob(parts, { type: o.meta.kind === 'folder' ? 'application/gzip' : o.meta.type || 'application/octet-stream' }); })
      .catch(function (e) { throw new Error(e && e.name === 'OperationError' ? "Couldn't unlock this file (it may have been changed)." : (e && e.message) || 'Download failed.'); });
  }
  function fileName(meta) { return meta.kind === 'folder' ? meta.name + '.tar.gz' : meta.name; }
  function saveBlob(blob, meta) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName(meta);
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }
  function getBlob(f, job) {
    return download({ chunks: f.chunks, size: f.size, meta: f.m, fk: f.fk, piece: function (n) { return call('piece?id=' + f.id + '&n=' + n, undefined, { method: 'GET' }); } }, function (p) { if (job) tick(job, p); });
  }
  function saveFile(f, sub, fromInbox) {
    if (!f.fk) return;
    var job = addJob('down', f.m.name, f.size);
    return getBlob(f, job).then(function (blob) {
      if (C.local) return fetch(LOCAL + 'save?name=' + encodeURIComponent(fileName(f.m)) + '&path=' + encodeURIComponent((sub || []).join('/')), { method: 'POST', body: blob }).then(function (r) { return r.json(); }).then(function (j) { if (j.error) throw new Error(j.error); finish(job, 'Saved to ' + j.where); });
      saveBlob(blob, f.m); finish(job, 'Saved');
    }).then(function () {
      if (fromInbox) return call('got', { id: f.id, drop: !!f.m.drop }).then(pollInbox);
    }).catch(function (e) { failJob(job, e.message); });
  }

  // uploads: one file at a time, PAR pieces in flight
  var upQ = Promise.resolve();
  function upload(file, folder, to) {
    var job = addJob('up', file.name, file.size);
    upQ = upQ.then(function () { return ensureDirs(folder); }).then(function () { return sendOne(file, folder, to, job); })
      .then(function () { finish(job, to ? 'Sent to ' + to.name : 'In your nest'); hop(); refresh(); }, function (e) { failJob(job, e.message); });
    return upQ;
  }
  function sendOne(file, folder, to, job) {
    var fk = crypto.getRandomValues(new Uint8Array(32));
    var chunks = Math.max(1, Math.ceil(file.size / CHUNK));
    var meta = { name: file.name, size: file.size, type: file.type || guessType(file.name), kind: 'file', from: deviceName(), made: file.lastModified || Date.now(), path: folder };
    return Promise.all([sealMeta(fk, meta), seal(myKey(), fk, 'pigeon/key')]).then(function (x) {
      return call('start', { size: file.size, chunks: chunks, meta: x[0], wrapped: b64(x[1]), device: deviceName(), to: to ? to.did : undefined });
    }).then(function (r) {
      var next = 0, sent = 0;
      function worker() {
        if (job.cancel) return Promise.reject(new Error('Stopped.'));
        if (next >= chunks) return Promise.resolve();
        var i = next++;
        return file.slice(i * CHUNK, (i + 1) * CHUNK).arrayBuffer().then(function (buf) {
          return seal(fk, buf, 'pigeon/chunk/' + i).then(function (box) { return retry(function () { return call('piece?id=' + r.id + '&n=' + i, box, { method: 'PUT' }); }); })
            .then(function () { sent += buf.byteLength; tick(job, sent / Math.max(1, file.size)); return worker(); });
        });
      }
      var w = []; for (var i = 0; i < Math.min(PAR, chunks); i++) w.push(worker());
      return Promise.all(w).then(function () { return call('finish', { id: r.id }); }, function (e) { call('delete', { ids: [r.id] }).catch(function () {}); throw e; });
    });
  }
  function retry(fn, n) { n = n || 3; return fn().catch(function (e) { if (n <= 1 || /room|too big|log in/i.test(e.message)) throw e; return new Promise(function (r) { setTimeout(r, 900); }).then(function () { return retry(fn, n - 1); }); }); }
  function guessType(n) { var e = (n.split('.').pop() || '').toLowerCase(); return { md: 'text/markdown', txt: 'text/plain', py: 'text/x-python', js: 'text/javascript', json: 'application/json', csv: 'text/csv', heic: 'image/heic' }[e] || 'application/octet-stream'; }
  function uploadList(list, to) {
    var folder = st.view === 'nest' ? st.path : [];
    Array.prototype.forEach.call(list, function (f) { upload(f, folder, to); });
  }
  $('pickFiles').onchange = function () { uploadList(this.files, sendTo); sendTo = null; this.value = ''; };
  $('pickFolder').onchange = function () {
    var base = st.view === 'nest' ? st.path : [];
    Array.prototype.forEach.call(this.files, function (f) { var rel = (f.webkitRelativePath || f.name).split('/'); upload(f, base.concat(rel.slice(0, -1))); });
    this.value = '';
  };
  // drag files in from your computer (folders too)
  var dragDepth = 0;
  function external(e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0; }
  document.addEventListener('dragenter', function (e) { if (!store || $('appView').hidden || !external(e)) return; e.preventDefault(); dragDepth++; $('content').classList.add('dragging'); });
  document.addEventListener('dragover', function (e) { if (external(e)) e.preventDefault(); });
  document.addEventListener('dragleave', function (e) { if (!external(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('content').classList.remove('dragging'); });
  document.addEventListener('drop', function (e) {
    if (!external(e)) return;
    e.preventDefault(); dragDepth = 0; $('content').classList.remove('dragging');
    if (!store || $('appView').hidden) return;
    var base = st.view === 'nest' ? st.path : [];
    var items = e.dataTransfer.items;
    if (items && items[0] && items[0].webkitGetAsEntry) {
      Array.prototype.forEach.call(items, function (it) { var en = it.webkitGetAsEntry(); if (en) walkEntry(en, base); });
    } else uploadList(e.dataTransfer.files);
  });
  function walkEntry(en, folder) {
    if (en.isFile) return en.file(function (f) { upload(f, folder); });
    if (!en.isDirectory || /^(node_modules|\.git|__pycache__|\.venv|venv|\.next|\.cache)$/.test(en.name)) return;
    var r = en.createReader(), here = folder.concat(en.name);
    ensureDirs(here);
    (function more() { r.readEntries(function (list) { if (!list.length) return; list.forEach(function (x) { walkEntry(x, here); }); more(); }); })();
  }
  // drag things onto folders to move them
  var dragging = null;
  $('content').addEventListener('dragstart', function (e) { var el = e.target.closest('[data-k]'); if (!el) return; if (!st.sel.has(el.dataset.k)) { st.sel.clear(); st.sel.add(el.dataset.k); } dragging = itemsSelected(); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'pigeon'); });
  $('content').addEventListener('dragend', function () { dragging = null; });
  $('content').addEventListener('dragover', function (e) { var el = e.target.closest('.folder'); if (dragging && el) { e.preventDefault(); el.classList.add('dropping'); } });
  $('content').addEventListener('dragleave', function (e) { var el = e.target.closest('.folder'); if (el) el.classList.remove('dropping'); });
  $('content').addEventListener('drop', function (e) { var el = e.target.closest('.folder'); if (!dragging || !el) return; e.preventDefault(); e.stopPropagation(); moveTo(dragging, byKey(el.dataset.k).path); });
  function dropTarget(el, path) {
    el.addEventListener('dragover', function (e) { if (dragging) { e.preventDefault(); el.classList.add('drop-target'); } });
    el.addEventListener('dragleave', function () { el.classList.remove('drop-target'); });
    el.addEventListener('drop', function (e) { if (!dragging) return; e.preventDefault(); el.classList.remove('drop-target'); moveTo(dragging, path); });
  }
  function moveTo(list, path) {
    var changes = [];
    list.forEach(function (x) {
      if (x.dir) { if (pk(path).indexOf(pk(x.path)) === 0) return; changes = changes.concat(rebase(x.path, path.concat(x.name))); }
      else if (pk(x.m.path) !== pk(path)) changes.push({ f: x, m: Object.assign({}, x.m, { path: path }) });
    });
    dragging = null;
    if (!changes.length) return;
    relabel(changes).then(function () { st.sel.clear(); toast('Moved to ' + (path.length ? path[path.length - 1] : 'My nest') + '.'); refresh(); }, alertErr);
  }

  // ── transfers tray ──
  var jobs = [];
  function addJob(dir, name, total) {
    var j = { id: Math.random().toString(36).slice(2), dir: dir, name: name, total: total, p: 0, state: 'go', note: dir === 'up' ? 'waiting' : 'unlocking', at: Date.now() };
    jobs.unshift(j); jobs = jobs.slice(0, 40); $('transfers').hidden = false; drawJobs(); return j;
  }
  function tick(j, p) { j.p = Math.min(1, p); var secs = (Date.now() - j.at) / 1000; j.note = Math.round(j.p * 100) + '%' + (secs > 1.5 && j.total ? ' · ' + size((j.total * j.p) / secs) + '/s' : ''); drawJobs(); }
  function finish(j, note) { j.p = 1; j.state = 'done'; j.note = note; drawJobs(); }
  function failJob(j, note) { j.state = 'bad'; j.note = note; drawJobs(); }
  var drawPending = false;
  function drawJobs() {
    if (drawPending) return; drawPending = true;
    requestAnimationFrame(function () {
      drawPending = false;
      var going = jobs.filter(function (j) { return j.state === 'go'; }).length;
      $('tTitle').textContent = going ? 'Flying · ' + going + ' left' : 'All landed';
      $('tlist').innerHTML = jobs.map(function (j) { return '<div class="tr ' + (j.state === 'done' ? 'done' : j.state === 'bad' ? 'bad' : '') + '"><div class="l">' + icon(j.dir === 'up' ? 'up' : 'down') + '<b>' + esc(j.name) + '</b><small>' + esc(j.note) + '</small></div><div class="bar"><i style="width:' + Math.round(j.p * 100) + '%"></i></div></div>'; }).join('');
    });
  }
  $('tClose').onclick = function () { $('transfers').hidden = true; jobs = jobs.filter(function (j) { return j.state === 'go'; }); };

  // ── little thumbnails for photos ──
  var thumbs = new Map(), thumbing = new Set(), thumbQ = [];
  var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { io.unobserve(e.target); wantThumb(e.target.dataset.thumb); } }); }, { rootMargin: '200px' }) : null;
  function paintThumbs() {
    document.querySelectorAll('[data-thumb]').forEach(function (el) {
      var f = st.files.filter(function (x) { return x.id === el.dataset.thumb; })[0];
      if (!f || thumbs.has(f.id) || !f.fk || !f.done || !/^image\/(png|jpe?g|gif|webp|avif)$/.test(f.m.type || '') || f.size > 8e6) return;
      if (io) io.observe(el); else wantThumb(f.id);
    });
  }
  function wantThumb(id) { if (thumbing.has(id) || thumbs.has(id)) return; thumbing.add(id); thumbQ.push(id); pumpThumbs(); }
  var thumbBusy = 0;
  function pumpThumbs() {
    while (thumbBusy < 2 && thumbQ.length) {
      var id = thumbQ.shift(), f = st.files.filter(function (x) { return x.id === id; })[0];
      if (!f) continue;
      thumbBusy++;
      getBlob(f).then(function (blob) { return shrink(blob); }).then(function (url) { thumbs.set(id, url); document.querySelectorAll('[data-thumb="' + id + '"]').forEach(function (el) { el.innerHTML = '<img alt="" src="' + url + '">'; }); }, function () {})
        .then(function () { thumbBusy--; pumpThumbs(); });
    }
  }
  function shrink(blob) { // keep small copies in memory, not whole photos
    return createImageBitmap(blob).then(function (bmp) {
      var s = Math.min(1, 360 / Math.max(bmp.width, bmp.height)), cv = document.createElement('canvas');
      cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
      cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
      return new Promise(function (r) { cv.toBlob(function (b) { r(URL.createObjectURL(b)); }, 'image/jpeg', .82); });
    }).catch(function () { return URL.createObjectURL(blob); });
  }

  // ── previews ──
  var viewing = null, viewUrl = null;
  function preview(f) {
    viewing = f;
    $('vTitle').textContent = f.m.name;
    $('vStage').innerHTML = '<div class="small">Unlocking… <span id="vPct"></span></div>';
    if (!$('viewerDlg').open) $('viewerDlg').showModal();
    getBlob(f, null).then(function (blob) {
      if (viewing !== f) return;
      if (viewUrl) URL.revokeObjectURL(viewUrl);
      var t = f.m.type || '', url = viewUrl = URL.createObjectURL(blob), html;
      if (/^image\//.test(t)) html = '<img alt="" src="' + url + '">';
      else if (/^video\//.test(t)) html = '<video controls autoplay src="' + url + '"></video>';
      else if (/^audio\//.test(t)) html = '<audio controls autoplay src="' + url + '"></audio>';
      else if (/pdf/.test(t)) html = '<iframe title="PDF" src="' + url + '"></iframe>';
      else return blob.slice(0, 262144).text().then(function (txt) { $('vStage').innerHTML = '<pre></pre>'; $('vStage').firstChild.textContent = txt + (blob.size > 262144 ? '\n\n… (save it to see the rest)' : ''); });
      $('vStage').innerHTML = html + (/^image\//.test(t) ? '<button class="icon-btn nav-arrow" style="left:10px" data-step="-1" aria-label="Previous">' + icon('left') + '</button><button class="icon-btn nav-arrow" style="right:10px" data-step="1" aria-label="Next">' + icon('right') + '</button>' : '');
      $('vStage').querySelectorAll('[data-step]').forEach(function (b) { b.onclick = function () { step(Number(b.dataset.step)); }; });
    }, function (e) { $('vStage').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; });
  }
  function step(d) {
    if (!viewing) return;
    var list = sorted(st.files.filter(function (x) { return !x.trashed && x.done && x.fk && x.m && /^image\//.test(x.m.type || '') && pk(x.m.path) === pk(viewing.m.path); }));
    var i = list.indexOf(viewing);
    if (i >= 0 && list.length > 1) preview(list[(i + d + list.length) % list.length]);
  }
  $('vClose').onclick = function () { $('viewerDlg').close(); };
  $('viewerDlg').addEventListener('close', function () { viewing = null; $('vStage').innerHTML = ''; if (viewUrl) { URL.revokeObjectURL(viewUrl); viewUrl = null; } });
  $('vSave').onclick = function () { if (viewing) saveFile(viewing, []); };

  // ── sharing ──
  function shareSheet(f) {
    call('share', { id: f.id, hours: 24 }).then(function (r) {
      var url = SITE + '/s/' + r.code + '#' + b64url(f.fk);
      var body = $('dlgBody');
      body.innerHTML = '<h3>' + esc(f.m.name) + '</h3><div class="sub">Anyone with this link can download it for 24 hours. Point a phone\'s camera at the code.</div><canvas class="qr" id="qr" width="10" height="10"></canvas><div class="url">' + esc(url) + '</div><div class="acts"><button class="btn" data-x>Done</button><button class="btn primary" data-copy>Copy link</button></div>';
      var q = window.pigeonQR.encode(url), cv = $('qr'), z = 3, n = q.size + z * 2;
      cv.width = cv.height = n;
      var g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, n, n); g.fillStyle = '#000';
      for (var y = 0; y < q.size; y++) for (var x = 0; x < q.size; x++) if (q.dark(x, y)) g.fillRect(x + z, y + z, 1, 1);
      body.querySelector('[data-x]').onclick = function () { $('dlg').close(); };
      var cb = body.querySelector('[data-copy]');
      cb.onclick = function () { copyText(url).then(function () { cb.textContent = 'Copied'; }, function () { cb.textContent = 'Select the link above'; }); };
      if (navigator.share && matchMedia('(pointer: coarse)').matches) { cb.textContent = 'Share'; cb.onclick = function () { navigator.share({ title: f.m.name, url: url }).catch(function () {}); }; }
      $('dlg').showModal();
    }, alertErr);
  }
  function copyText(t) { return navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject(new Error('no clipboard')); }
  function invite() {
    call('invite', {}).then(function (r) {
      var code = r.code.slice(0, 4) + '-' + r.code.slice(4), link = location.origin + location.pathname + '#invite=' + r.code;
      var body = $('dlgBody');
      body.innerHTML = '<h3>Invite someone</h3><div class="sub">Give them this code (or link). It makes one new nest, and works for 7 days. Their nest is theirs: you can\'t see inside it.</div><div class="url" style="font-size:1.4rem;text-align:center;letter-spacing:.08em">' + esc(code) + '</div><div class="url" style="margin-top:8px">' + esc(link) + '</div><div class="acts"><button class="btn" data-x>Done</button><button class="btn primary" data-copy>Copy link</button></div>';
      body.querySelector('[data-x]').onclick = function () { $('dlg').close(); };
      body.querySelector('[data-copy]').onclick = function () { var b = this; copyText(link).then(function () { b.textContent = 'Copied'; }); };
      $('dlg').showModal();
    }, alertErr);
  }
  function getApp() {
    var body = $('dlgBody');
    body.innerHTML = '<h3>pigeon for your computer</h3><div class="sub">Send and get files from the terminal, keep a copy of your nest in a folder, and open this page already signed in with <b>pigeon dashboard</b>.</div><div class="small">Mac or Linux, in Terminal:</div><code class="cmd">curl -fsSL ' + esc(C.sh || SITE + '/install.sh') + ' | sh</code><div class="small">Windows, in PowerShell:</div><code class="cmd">irm ' + esc(C.ps1 || SITE + '/install.ps1') + ' | iex</code><div class="acts"><button class="btn primary" data-x>Done</button></div>';
    body.querySelector('[data-x]').onclick = function () { $('dlg').close(); };
    $('dlg').showModal();
  }

  // ── small dialogs ──
  function promptBox(title, sub, value, ok) {
    return new Promise(function (resolve) {
      var body = $('dlgBody');
      body.innerHTML = '<form method="dialog"><h3>' + esc(title) + '</h3>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '<label class="field"><input id="pIn" maxlength="120"></label><div class="acts"><button class="btn" value="no" type="button" data-x>Cancel</button><button class="btn primary" value="ok">' + esc(ok) + '</button></div></form>';
      var input = $('pIn'); input.value = value || '';
      var done = false;
      body.querySelector('[data-x]').onclick = function () { done = true; $('dlg').close(); resolve(null); };
      body.querySelector('form').onsubmit = function (e) { e.preventDefault(); done = true; $('dlg').close(); resolve(input.value); };
      $('dlg').addEventListener('close', function once() { $('dlg').removeEventListener('close', once); if (!done) resolve(null); });
      $('dlg').showModal();
      var dot = input.value.lastIndexOf('.');
      input.focus(); input.setSelectionRange(0, dot > 0 ? dot : input.value.length);
    });
  }
  function confirmBox(title, sub, ok) {
    return new Promise(function (resolve) {
      var body = $('dlgBody');
      body.innerHTML = '<h3>' + esc(title) + '</h3><div class="sub">' + esc(sub) + '</div><div class="acts"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok style="background:var(--rose)">' + esc(ok) + '</button></div>';
      var done = false;
      body.querySelector('[data-x]').onclick = function () { done = true; $('dlg').close(); resolve(false); };
      body.querySelector('[data-ok]').onclick = function () { done = true; $('dlg').close(); resolve(true); };
      $('dlg').addEventListener('close', function once() { $('dlg').removeEventListener('close', once); if (!done) resolve(false); });
      $('dlg').showModal();
    });
  }
  function alertErr(e) { toast((e && e.message) || 'Something went wrong.'); }
  function toast(text, actLabel, fn) {
    var t = $('toast');
    t.innerHTML = '<span></span>' + (actLabel ? '<button>' + esc(actLabel) + '</button>' : '');
    t.firstChild.textContent = text;
    if (actLabel) t.querySelector('button').onclick = function () { t.hidden = true; fn(); };
    t.hidden = false;
    clearTimeout(timers.toast);
    timers.toast = setTimeout(function () { t.hidden = true; }, actLabel ? 7000 : 3500);
  }

  // ── search, sorting, layout, keys ──
  $('q').addEventListener('input', function () { st.q = this.value.trim(); if (st.q) { st.view = 'search'; st.sel.clear(); render(); } else go('nest', st.path); });
  $('sort').onchange = function () { st.sort = this.value; try { localStorage.setItem('pigeon-sort', st.sort); } catch (e) { /* fine */ } render(); };
  function layoutButtons() { $('gridBtn').setAttribute('aria-pressed', String(st.layout === 'grid')); $('listBtn').setAttribute('aria-pressed', String(st.layout === 'list')); }
  $('gridBtn').onclick = function () { st.layout = 'grid'; try { localStorage.setItem('pigeon-layout', 'grid'); } catch (e) { /* fine */ } layoutButtons(); render(); };
  $('listBtn').onclick = function () { st.layout = 'list'; try { localStorage.setItem('pigeon-layout', 'list'); } catch (e) { /* fine */ } layoutButtons(); render(); };
  document.addEventListener('keydown', function (e) {
    if (!store || $('appView').hidden || $('dlg').open) return;
    if ($('viewerDlg').open) { if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); return; }
    var typing = /input|textarea|select/i.test((document.activeElement || {}).tagName || '');
    if (e.key === '/' && !typing) { e.preventDefault(); $('q').focus(); return; }
    if (typing) { if (e.key === 'Escape') document.activeElement.blur(); return; }
    var sel = itemsSelected();
    if (e.key === 'Escape') { hideMenu(); st.sel.clear(); paintSelection(); }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && sel.length) { e.preventDefault(); act(st.view === 'trash' ? 'forever' : 'trash', sel); }
    else if (e.key === 'Enter' && sel.length === 1) openItem(sel[0]);
    else if ((e.key === 'F2' || e.key === 'r') && sel.length === 1 && st.view !== 'trash') { e.preventDefault(); act('rename', sel); }
    else if ((e.metaKey || e.ctrlKey) && e.key === 'a') { e.preventDefault(); document.querySelectorAll('#content [data-k]').forEach(function (x) { st.sel.add(x.dataset.k); }); paintSelection(); }
    else if (e.key === 'Backspace' && st.view === 'nest' && st.path.length) go('nest', st.path.slice(0, -1));
  });

  // ── off we go ──
  if (C.local) { store = C.session; start(); }
  else {
    store = remembered();
    if (store && store.token) start(); else show('login');
  }
})();
</script>
</body>
