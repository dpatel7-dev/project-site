<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ball and Wall</title>
<style>
  body { margin: 0; overflow: hidden; background-color: #111; font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; align-items: center; height: 100vh; user-select: none; position: relative; color: white; }
  canvas { background-color: #1a1a1a; box-shadow: 0 0 40px rgba(0, 0, 0, 0.5); border: 4px solid #444; border-right: 4px solid #fff; position: relative; z-index: 1; }
  #scanline { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 2px, 3px 100%; pointer-events: none; z-index: 2; opacity: 0; transition: opacity 0.2s; }
  #ui-layer { position: absolute; top: 5%; width: 100%; text-align: center; pointer-events: none; z-index: 3; user-select: none; }
  #score { color: #fff; font-size: 80px; font-weight: 900; margin: 0; text-shadow: 0 5px 0 #000; }
  #msg { font-size: 24px; font-weight: bold; height: 30px; margin-top: 5px; text-shadow: 2px 2px 0px #000; letter-spacing: 2px; }
  #coins { position: absolute; top: 20px; left: 20px; font-size: 20px; font-weight: 700; color: gold; text-shadow: 0 0 5px black; user-select: none; z-index: 4000; }
  #power-container { position: absolute; bottom: 60px; width: 300px; height: 20px; background: #000; border: 2px solid #555; border-radius: 4px; overflow: hidden; z-index: 3; }
  #power-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00ccff, #0055ff); transition: width 0.1s; }
  #matrix-container { position: absolute; top: 20px; width: 400px; height: 10px; background: #000; border: 1px solid #333; border-radius: 2px; overflow: hidden; z-index: 3; left: 50%; transform: translateX(-50%); }
  #matrix-fill { width: 100%; height: 100%; background: #00ff00; box-shadow: 0 0 10px #00ff00; }
  #controls-hint { position: absolute; bottom: 20px; color: #666; font-size: 14px; z-index: 3; user-select: none; }
  /* Shop overlay */
  #shopOverlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(30, 30, 30, 0.95); border-radius: 10px; padding: 20px; width: 380px; max-height: 90vh; overflow-y: auto; box-shadow: 0 0 20px #00ccff; font-family: monospace; color: white; z-index: 5000; display: none; }
  #shopOverlay h2 { margin-top: 0; text-align: center; font-size: 1.6rem; text-shadow: 0 0 4px #00ccff; user-select: none; }
  #shopOverlay label { display: block; font-weight: 700; margin-top: 15px; margin-bottom: 6px; font-size: 1.2rem; user-select: none; }
  .item-list { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .shop-item { border: 2px solid transparent; border-radius: 6px; cursor: pointer; width: 90px; padding: 6px; text-align: center; user-select: none; transition: border-color 0.3s; outline-offset: 3px; position: relative; background: #222; }
  .shop-item:hover, .shop-item.selected { border-color: #00ccff; box-shadow: 0 0 8px #00ccff; }
  .shop-ball { border-radius: 50%; margin: 0 auto 6px; height: 48px; width: 48px; box-shadow: 0 0 10px inset currentColor; }
  .shop-ball.hex { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
  .shop-ball.star { clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .shop-racquet { height: 36px; width: 72px; margin: 0 auto 6px; outline: 2px solid transparent; box-sizing: border-box; border-radius: 8px; position: relative; box-shadow: inset 0 0 6px black; }
  .shop-racquet.bow { border-radius: 50% / 100%; }
  .shop-racquet.traditional { border-radius: 12px 12px 30px 30px; }
  .shop-racquet.modern { border-radius: 8px; }
  .shop-racquet .handle { position: absolute; bottom: 0; left: 24px; width: 12px; height: 18px; background: #222; border-radius: 3px; box-shadow: inset 0 0 5px #000; }
  .power-label { font-size: 0.8rem; color: #bbb; min-height: 48px; font-weight: 600; text-shadow: 0 0 1px #000; }
  .cost-label { position: absolute; top: 5px; right: 5px; font-size: 0.8rem; background: #000a; padding: 0 5px; border-radius: 3px; font-weight: bold; color: gold; user-select: none; }
  #shopCoins { margin-top: 15px; font-size: 1.25rem; font-weight: 700; color: gold; text-align: center; text-shadow: 0 0 5px black; user-select: none; }
  #openShopBtn { position: fixed; top: 20px; right: 20px; background-color: #111; color: white; border: 1px solid #00ccff; padding: 10px 15px; font-family: monospace; cursor: pointer; border-radius: 6px; user-select: none; z-index: 4000; transition: background-color 0.3s; }
  #openShopBtn:hover, #openShopBtn:focus { background-color: #00ccff; color: #111; outline: none; }
  #closeShopBtn { margin-top: 20px; display: block; background-color: #00ccff; border:none; color: #111; cursor: pointer; padding: 8px 20px; font-family: monospace; font-weight: 700; font-size: 1rem; border-radius: 6px; user-select: none; margin-left: auto; margin-right: auto; transition: background-color 0.3s; }
  #closeShopBtn:hover, #closeShopBtn:focus { background-color: #0088cc; outline: none; }
</style>
</head>

<body>
<div id="coins" aria-live="polite" aria-atomic="true">Coins: 0</div>
<button id="openShopBtn" aria-label="Open Shop" title="Open Shop">SHOP</button>

<div id="shopOverlay" role="dialog" aria-modal="true" aria-labelledby="shopTitle" tabindex="-1">
  <h2 id="shopTitle">Loadout Shop</h2>
  <label for="ballSelection">Choose your Ball Skin</label>
  <div class="item-list" id="ballSelection"></div>
  <label for="racquetSelection">Choose your Racquet Skin</label>
  <div class="item-list" id="racquetSelection"></div>
  <div id="shopCoins">Coins: 0</div>
  <button id="closeShopBtn">Close Shop</button>
</div>

<div id="scanline"></div>
<div id="matrix-container"><div id="matrix-fill"></div></div>
<div id="ui-layer">
  <div id="score">0</div>
  <div id="msg" style="color: #fff;">READY?</div>
</div>
<div id="power-container"><div id="power-fill"></div></div>
<div id="controls-hint">
  W/A/D to Jump/Move | SPACE to Swing | SHIFT for SLOW-MO | ARROWS to Aim
</div>

<canvas id="gameCanvas" width="900" height="500" aria-label="Ball and Wall game"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scanline = document.getElementById('scanline');
const matrixBar = document.getElementById('matrix-fill');
const powerFill = document.getElementById('power-fill');
const scoreEl = document.getElementById('score');
const msgEl = document.getElementById('msg');
const coinsEl = document.getElementById('coins');
const shopOverlay = document.getElementById('shopOverlay');
const openShopBtn = document.getElementById('openShopBtn');
const closeShopBtn = document.getElementById('closeShopBtn');
const ballSelection = document.getElementById('ballSelection');
const racquetSelection = document.getElementById('racquetSelection');
const shopCoins = document.getElementById('shopCoins');

// --- CONFIGURATION ---
canvas.width = 900;
canvas.height = 500;

const GROUND_Y = canvas.height - 50;
const WALL_X = canvas.width - 50;

// PHYSICS
const BASE_GRAVITY = 0.55;
const FRICTION = 0.999;
const FLOOR_BOUNCE = -0.9;
const WALL_BOUNCE = -0.85;
const PLAYER_GRAVITY = 0.8; 

// MATRIX SETTINGS
const MAX_MATRIX_FUEL = 900;
const RECHARGE_RATE_BASE = 2; // base recharge rate
const COOLDOWN_DURATION = 5000;

// --- INPUT STATE ---
const keys = {
  ArrowUp:false, ArrowDown:false, ArrowLeft:false, ArrowRight:false,
  Space:false, Shift:false, KeyW:false, KeyA:false, KeyD:false
};

// --- GAME STATE ---
let gameRunning = false;
let score = 0;
let speedMultiplier = 1.0;
let particles = [];
let shake = 0;

// SLOW MO STATE
let isSlowMo = false;
let timeScale = 1.0;
let matrixFuel = MAX_MATRIX_FUEL;
let matrixLocked = false;
let matrixLockTimeout = null;

// POWER SYSTEM
let powerMeter = 0;
let isOverdrive = false;

// COINS
let coins = 0;
const COINS_KEY = "ballandwall_coins";
const LOADOUT_KEY = "ballandwall_loadout";

// --- LOADOUT & ITEMS ---

const balls = [
  {id:"classic", name:"Classic", color:"#ffffff", radius:10, trailColor:"rgba(255,255,255,0.6)",     power: {speed:1.0, bounce:1.0, ability:"None"}, cost:0,   appearance:"basic"},
  {id:"fire", name:"Fireball", color:"#ff5733", radius:12, trailColor:"rgba(255,87,51,0.8)",     power: {speed:1.1, bounce:1.1, ability:"None"}, cost:450,    appearance:"basic"},
  {id:"ice", name:"Iceball", color:"#33cfff", radius:9, trailColor:"rgba(51,207,255,0.7)",     power: {speed:0.95, bounce:1.3, ability:"BounceBoost"}, cost:1295,   appearance:"hex"},
  {id:"electric", name:"Electric", color:"#ffff33", radius:11, trailColor:"rgba(255,255,51,0.9)",     power: {speed:1.2, bounce:0.85, ability:"Regenerate"}, cost:2190,    appearance:"star"},
  {id:"shadow", name:"Shadow", color:"#6a4585", radius:14, trailColor:"rgba(106,69,133,0.9)",   power: {speed:1.0, bounce:1.5, ability:"LuckyBounce"}, cost:4670,   appearance:"basic"},
  {id:"golden", name:"The Golden Ball", color:"#FFDF00", radius:20, trailColor:"rgba(255,223,0,0.9)",   power: {speed:5.0, bounce:10.0, ability:"SpinBoost"}, cost:100000,   appearance:"star"},
];

const racquets = [
  {id:"modern", name:"Modern", color:"#00ccff", swingColor:"rgba(0,204,255,0.6)",    matrixRechargeMult:1.0, swingPower:1.0, coinMultiplier:1.0, cost:0,   appearance:"modern", ability:"None"},
  {id:"redsteel", name:"Redsteel", color:"#d22d3e", swingColor:"rgba(210,45,62,0.7)",   matrixRechargeMult:1.3, swingPower:1.3, coinMultiplier:1.15, cost:2000,   appearance:"traditional", ability:"CoinBoost"},
  {id:"dark", name:"Dark", color:"#444444", swingColor:"rgba(100,100,100,0.5)",   matrixRechargeMult:1.1, swingPower:1.1, coinMultiplier:1.1, cost:4500,   appearance:"modern", ability:"SlowRecharge"},
  {id:"neon", name:"Neon", color:"#00ff7f", swingColor:"rgba(0,255,127,0.8)",   matrixRechargeMult:1.5, swingPower:1.5, coinMultiplier:1.25, cost:7500,   appearance:"bow", ability:"SpeedBoost"},
  {id:"prime", name:"Prime", color:"#ff99cc", swingColor:"rgba(255,153,204,0.9)",   matrixRechargeMult:1.7, swingPower:1.7, coinMultiplier:1.5, cost:9700,   appearance:"traditional", ability:"PowerHit"},
  {id:"golden", name:"Golden Racket", color:"#D3AF37", swingColor:"rgba(218,165,32,1)",   matrixRechargeMult:100, swingPower:50, coinMultiplier:10, cost:100000,   appearance:"modern", ability:"OverdriveDouble"},
];

// Current selections
let currentBall = balls[0];
let currentRacquet = racquets[0];

// Player
const player = {
  x: 100, y: GROUND_Y - 60, w: 30, h: 60, speed: 8,
  vy: 0,
  jumpForce: -14,
  isGrounded: true,
  jumpCooldown: 0,  // Added jump cooldown counter
  swingCooldown: 0,
  color: currentRacquet.color,
  swingColor: currentRacquet.swingColor,
  isSwinging: false,
  swingTimer: 0,
  aimAngle: -0.5
};

// Ball
const ball = {
  x: 200, y: 200, r: currentBall.radius, vx:0, vy:0,
  color: currentBall.color, trail:[], trailColor: currentBall.trailColor
};

// --- UTILITIES ---

function saveLoadout() {
  const loadout = {
    ballId: currentBall.id,
    racquetId: currentRacquet.id,
    coins: coins
  };
  localStorage.setItem(LOADOUT_KEY, JSON.stringify(loadout));
  localStorage.setItem(COINS_KEY, coins.toString());
}

function loadLoadout() {
  const saved = localStorage.getItem(LOADOUT_KEY);
  if(saved) {
    try {
      const loadout = JSON.parse(saved);
      const savedCoins = localStorage.getItem(COINS_KEY);
      if(savedCoins != null) coins = parseInt(savedCoins,10) || 0;
      const ballSaved = balls.find(b=>b.id === loadout.ballId);
      const racquetSaved = racquets.find(r=>r.id === loadout.racquetId);
      if(ballSaved) currentBall = ballSaved;
      if(racquetSaved) currentRacquet = racquetSaved;
    } catch(e){}
  }
}

function updateLoadoutUI() {
  player.color = currentRacquet.color;
  player.swingColor = currentRacquet.swingColor;
  ball.color = currentBall.color;
  ball.r = currentBall.radius;
  ball.trailColor = currentBall.trailColor;
}

function updateCoinsUI() {
  coinsEl.textContent = `Coins: ${coins}`;
  shopCoins.textContent = `Coins: ${coins}`;
}

function createShopItems(container, items, currentSelectedId, isBall=true) {
  container.innerHTML = '';
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'shop-item' + (item.id === currentSelectedId ? ' selected' : '');
    div.tabIndex = 0;
    div.role = 'button';
    div.setAttribute('aria-pressed', (item.id === currentSelectedId).toString());
    div.title = `${item.name}${item.cost > 0 ? ` - ${item.cost} coins` : ' (free)'}`;
    div.dataset.id = item.id;

    // Ball appearance
    if(isBall){
      const ballDiv = document.createElement('div');
      ballDiv.className = 'shop-ball';
      ballDiv.style.color = item.color;
      ballDiv.style.backgroundColor = item.color;
      ballDiv.style.width = (item.radius * 4)+'px';
      ballDiv.style.height = (item.radius * 4)+'px';
      ballDiv.style.marginLeft = `calc(50% - ${(item.radius*2)}px)`;
      if(item.appearance === "hex") ballDiv.classList.add('hex');
      else if(item.appearance === "star") ballDiv.classList.add('star');
      div.appendChild(ballDiv);
    } else { // Racquet appearance
      const rqDiv = document.createElement('div');
      rqDiv.className = 'shop-racquet';
      rqDiv.style.color = item.color;
      rqDiv.style.backgroundColor = item.color;
      if(item.appearance) rqDiv.classList.add(item.appearance);
      const handleDiv = document.createElement('div');
      handleDiv.className = 'handle';
      rqDiv.appendChild(handleDiv);
      div.appendChild(rqDiv);
    }

    const nameDiv = document.createElement('div');
    nameDiv.textContent = item.name;
    div.appendChild(nameDiv);

    const powerDiv = document.createElement('div');
    powerDiv.className = 'power-label';
    if(isBall) {
      powerDiv.textContent = `Speed x${item.power.speed.toFixed(2)} Bounce x${item.power.bounce.toFixed(2)} Ability: ${item.power.ability}`;
    } else {
      powerDiv.textContent = `Recharge x${item.matrixRechargeMult.toFixed(2)} Swing x${item.swingPower.toFixed(2)} Coins x${item.coinMultiplier.toFixed(2)} Ability: ${item.ability || 'None'}`;
    }
    div.appendChild(powerDiv);

    if(item.cost > 0){
      const costDiv = document.createElement('div');
      costDiv.className = 'cost-label';
      costDiv.textContent = item.cost;
      div.appendChild(costDiv);
    }

    div.addEventListener('click', () => {
      if(item.cost > 0 && coins < item.cost){
        alert(`You need ${item.cost} coins to buy ${item.name}.`);
        return;
      }
      if(item.cost > 0 && ((isBall && currentBall.id !== item.id) || (!isBall && currentRacquet.id !== item.id))){
        coins -= item.cost;
        updateCoinsUI();
      }
      if(isBall) currentBall = item;
      else currentRacquet = item;
      updateLoadoutUI();
      saveLoadout();
      highlightSelected();
    });
    div.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        div.click();
      }
    });

    container.appendChild(div);
  });
}

function highlightSelected(){
  [...ballSelection.children].forEach(child => {
    child.classList.toggle('selected', child.dataset.id === currentBall.id);
    child.setAttribute('aria-pressed', child.dataset.id === currentBall.id ? 'true' : 'false');
  });
  [...racquetSelection.children].forEach(child => {
    child.classList.toggle('selected', child.dataset.id === currentRacquet.id);
    child.setAttribute('aria-pressed', child.dataset.id === currentRacquet.id ? 'true' : 'false');
  });
}

// --- Game functions ---

function applyAbilitiesPerFrame() {
  if(currentBall.power.ability === "Regenerate" && !matrixLocked){
    matrixFuel += 0.7;
    if(matrixFuel > MAX_MATRIX_FUEL) matrixFuel = MAX_MATRIX_FUEL;
  }
  if(currentRacquet.ability === "SlowRecharge" && !matrixLocked){
    matrixFuel += 0.3;
    if(matrixFuel > MAX_MATRIX_FUEL) matrixFuel = MAX_MATRIX_FUEL;
  }
}

function resetGame() {
  score = 0;
  speedMultiplier = 1.0;
  powerMeter = 0;
  matrixFuel = MAX_MATRIX_FUEL;
  matrixLocked = false;
  if(matrixLockTimeout){
    clearTimeout(matrixLockTimeout);
    matrixLockTimeout = null;
  }
  updatePowerUI();
  updateCoinsUI();
  gameRunning = true;
  isSlowMo = false;
  updateUI("SERVE!", "#fff");

  player.x = 100;
  player.y = GROUND_Y - 60;
  player.vy = 0;
  player.isGrounded = true;
  player.jumpCooldown = 0;
  player.swingCooldown = 0;
  player.isSwinging = false;
  player.swingTimer = 0;

  ball.x = 150;
  ball.y = 250;
  ball.vx = 2;
  ball.vy = -10;

  updateLoadoutUI();
}

function attemptSwing(){
  if(player.swingCooldown > 0) return; // ignore swing if in cooldown

  player.isSwinging = true;
  player.swingTimer = 15;
  player.swingCooldown = 30; // ~0.5 seconds cooldown at 60fps

  const dx = ball.x - player.x;
  const dy = ball.y - (player.y + player.h/2);
  const dist = Math.sqrt(dx*dx + dy*dy);

  if(dist < 130 && Math.abs(dx) < 100){
    isOverdrive = false;
    if(powerMeter >= 100){
      isOverdrive = true;
      powerMeter = 0;
      updatePowerUI();
      shake = 20;
      createExplosion(ball.x, ball.y, "#ff0000", 50);
    }

    let hitPower = 1.0;
    let msg = "";
    let col = "#fff";
    let coinReward = 0;

    if(dx > 0 && dx < 60){
      msg = isOverdrive ? "MAX POWER!" : "PERFECT!";
      col = isOverdrive ? "#ff3333" : "#00ff00";
      hitPower = isOverdrive ? 2.5 : 1.3;
      speedMultiplier = Math.min(speedMultiplier + 0.1, 2.5);
      if(!isOverdrive){
        powerMeter = Math.min(powerMeter + 25, 100);
        updatePowerUI();
      }
      score += isOverdrive ? 50 : 10;
      coinReward = isOverdrive ? 25 : 10;
      createExplosion(ball.x, ball.y, col, 20);
    }else{
      msg = "GOOD";
      col = "#ffff00";
      hitPower = 0.9;
      speedMultiplier = Math.max(1.0, speedMultiplier - 0.1);
      if(!isOverdrive){
        powerMeter = Math.min(powerMeter + 10, 100);
        updatePowerUI();
      }
      score += 5;
      coinReward = 5;
    }

    // Apply coin multiplier from racquet ability
    const coinMultiplier = currentRacquet.coinMultiplier || 1.0;
    if(currentRacquet.ability === "CoinBoost"){
      coinReward = Math.floor(coinReward * coinMultiplier);
    } else {
      coinReward = Math.floor(coinReward * currentRacquet.coinMultiplier);
    }

    coins += coinReward;
    updateCoinsUI();
    saveLoadout();

    updateUI(msg, col);

    let speed = 15 * speedMultiplier * hitPower * currentBall.power.speed;
    ball.vx = Math.cos(player.aimAngle) * speed;
    ball.vy = Math.sin(player.aimAngle) * speed;

    if(ball.x < player.x + 40) ball.x = player.x + 40;
  }
}

function update(){
  if(!gameRunning) return;

  applyAbilitiesPerFrame();

  const rechargeRate = RECHARGE_RATE_BASE * currentRacquet.matrixRechargeMult;
  if(!matrixLocked && keys.Shift && matrixFuel > 0){
    isSlowMo = true;
    matrixFuel -= 6;
    if(matrixFuel <= 0){
      matrixFuel = 0;
      matrixLocked = true;
      matrixLockTimeout = setTimeout(()=>{
        matrixLocked = false; 
        matrixLockTimeout = null; 
        updateUI("Matrix battery recharged! Slow-mo available.", "#0f0");
      }, COOLDOWN_DURATION);
      updateUI("Matrix battery drained! Slow-mo disabled for 5 seconds.", "red");
    }
  }else{
    isSlowMo = false;
    if(!matrixLocked && matrixFuel < MAX_MATRIX_FUEL){
      matrixFuel += rechargeRate;
      if(matrixFuel > MAX_MATRIX_FUEL) matrixFuel = MAX_MATRIX_FUEL;
    }
  }

  // Update battery UI
  const pct = (matrixFuel / MAX_MATRIX_FUEL) * 100;
  matrixBar.style.width = pct + "%";
  if(matrixLocked) {
    matrixBar.style.background = "#880000";
    matrixBar.style.boxShadow = "0 0 10px #880000";
  } else {
    matrixBar.style.background = pct < 20 ? "#ff0000" : "#00ff00";
    matrixBar.style.boxShadow = pct < 20 ? "0 0 10px #ff0000" : "0 0 10px #00ff00";
  }

  if(isSlowMo){
    timeScale = 0.15;
    scanline.style.opacity = 0.3;
    canvas.style.backgroundColor = "#0a1a0a";
  }else{
    timeScale = 1.0;
    scanline.style.opacity = 0;
    canvas.style.backgroundColor = "#1a1a1a";
  }

  // --- PLAYER MOVEMENT & JUMPING ---
    // Decrease Cooldowns
  if(player.jumpCooldown > 0) player.jumpCooldown--;
  if(player.swingCooldown > 0) player.swingCooldown--;

  // Horizontal Move (A and D keys)
  if(keys.KeyA) player.x -= player.speed;
  if(keys.KeyD) player.x += player.speed;
  if(player.x < 0) player.x = 0;
  if(player.x > WALL_X - 100) player.x = WALL_X - 100;

  // Jump Trigger (W ONLY) with cooldown check
  if(keys.KeyW && player.isGrounded && player.jumpCooldown <= 0){
    player.vy = player.jumpForce;
    player.isGrounded = false;
    player.jumpCooldown = 70; // 70 frames approx 1.16 seconds cooldown
  }

  // Apply Player Gravity
  player.vy += PLAYER_GRAVITY;
  player.y += player.vy;

  // Player Floor Collision
  if(player.y + player.h > GROUND_Y){
    player.y = GROUND_Y - player.h;
    player.vy = 0;
    player.isGrounded = true;
  }

  // Aiming with Arrow keys (ArrowUp and ArrowDown)
  let targetAngle = -0.5;
  if(keys.ArrowUp) targetAngle = -1.2;
  if(keys.ArrowDown) targetAngle = 0.1;
  player.aimAngle += (targetAngle - player.aimAngle) * 0.2;

  // --- END PLAYER PHYSICS ---

  // Ball physics
  let currentGravity = BASE_GRAVITY;
  if(isOverdrive) currentGravity = BASE_GRAVITY * 0.3;

  ball.vy += currentGravity * timeScale;

  if(!isOverdrive){
    ball.vx *= 1 - ((1 - FRICTION) * timeScale);
  }

  ball.x += ball.vx * timeScale;
  ball.y += ball.vy * timeScale;

  ball.trail.push({x: ball.x, y: ball.y});
  if(ball.trail.length > 10) ball.trail.shift();

  // Wall collision with bounce multiplier
  if(ball.x + ball.r > WALL_X){
    ball.x = WALL_X - ball.r;
    
    // --- EDITED SECTION: RED BOX BOOST ---
    // Check if the ball hit the red box (bottom 50px of wall)
    if(ball.y > GROUND_Y - 50) {
      // It's a hit on the tin! Supercharge it.
      ball.vx = -35; // Rocket speed backwards
      ball.vy = -5 + (Math.random() * 10); // Random slight vertical variance
      isOverdrive = true;
      shake = 30; // Heavy screen shake
      createExplosion(ball.x, ball.y, "#ff0000", 60);
      updateUI("TURBO BOOST!", "#ff3333");
    } else {
      // Normal Wall Bounce
      ball.vx *= WALL_BOUNCE * currentBall.power.bounce;
      if(isOverdrive){
        isOverdrive = false;
        shake = 10;
        createExplosion(ball.x, ball.y, "#ffaa00", 30);
      } else {
        createExplosion(ball.x, ball.y, "#fff", 5);
      }
    }
  }

  // Ceiling collision
  if(ball.y - ball.r < 0){
    ball.y = ball.r;
    ball.vy *= WALL_BOUNCE;
  }

  // Floor collision
  if(ball.y + ball.r > GROUND_Y){
    ball.y = GROUND_Y - ball.r;
    ball.vy *= FLOOR_BOUNCE;
    if(Math.abs(ball.vy) < 2){
      ball.vx *= 1 - (0.04 * timeScale);
    }
  }

  // Game Over
  if(ball.x < 0){
    gameRunning = false;
    updateUI("MISS! SPACE TO RESTART", "red");
  }

  // Particles
  updateParticles();

  if(shake > 0) shake *= 0.9;
  if(shake < 0.5) shake = 0;

  if(player.swingTimer > 0) player.swingTimer--;
}

function createExplosion(x, y, color, count){
  for(let i=0; i<count; i++){
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 15,
      vy: (Math.random() - 0.5) * 15,
      life: 1.0,
      color: color
    });
  }
}

function updateParticles(){
  for(let i=particles.length-1; i>=0; i--){
    let p = particles[i];
    p.x += p.vx * timeScale;
    p.y += p.vy * timeScale;
    p.life -= 0.03 * timeScale;
    if(p.life <= 0) particles.splice(i, 1);
  }
}

function updateUI(text, color){
  scoreEl.innerText = score;
  msgEl.innerText = text;
  msgEl.style.color = color;
  coinsEl.style.color = "gold";
}

function updatePowerUI(){
  const pct = matrixFuel / MAX_MATRIX_FUEL * 100;
  powerFill.style.width = pct + "%";
  if(matrixLocked){
    powerFill.style.background = "#880000";
    powerFill.style.boxShadow = "0 0 10px #880000";
  } else if(matrixFuel >= 100){
    powerFill.style.background = "linear-gradient(90deg, #ff0000, #ffff00)";
    powerFill.style.boxShadow = "0 0 10px #ff0000";
  } else {
    powerFill.style.background = "linear-gradient(90deg, #00ccff, #0055ff)";
    powerFill.style.boxShadow = "none";
  }
}

// Start game loop
function draw(){
  ctx.save();
  if(shake > 0){
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }

  ctx.fillStyle = isSlowMo ? "#0a1a0a" : "#25252e";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Court Lines
  ctx.strokeStyle = isSlowMo ? "#004400" : "#555";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(canvas.width, GROUND_Y);
  ctx.stroke();

  // Wall & Tin
  ctx.fillStyle = "#3a3a45";
  ctx.fillRect(WALL_X, 0, 50, canvas.height);
  ctx.fillStyle = "#cc2222";
  ctx.fillRect(WALL_X, GROUND_Y - 50, 50, 50);

  // Aim line
  if(gameRunning){
    const aimLen = 100;
    const aimX = player.x + 15 + Math.cos(player.aimAngle) * aimLen;
    const aimY = player.y + 30 + Math.sin(player.aimAngle) * aimLen;
    ctx.beginPath();
    ctx.strokeStyle = player.swingColor;
    ctx.lineWidth = 4 * currentRacquet.swingPower;
    ctx.setLineDash([5,5]);
    ctx.moveTo(player.x + 15, player.y + 30);
    ctx.lineTo(aimX, aimY);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Player
  ctx.fillStyle = player.color;
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // Swing arc
  if(player.swingTimer > 0){
    ctx.strokeStyle = player.swingColor;
    ctx.lineWidth = 5 * currentRacquet.swingPower;
    ctx.beginPath();
    ctx.arc(player.x+15, player.y+30, 70, player.aimAngle-0.6, player.aimAngle+0.6);
    ctx.stroke();
  }

  // Ball trail
  if(gameRunning){
    for(let i=0; i < ball.trail.length; i++){
      const pos = ball.trail[i];
      const alpha = i / ball.trail.length;
      ctx.fillStyle = isOverdrive ? `rgba(255,50,50,${alpha})` : ball.trailColor.replace(/[,)]/, `,${alpha*0.7})`);
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, ball.r*(0.5+alpha*0.5), 0, Math.PI*2);
      ctx.fill();
    }
  }

  // Ball
  if(gameRunning){
    ctx.fillStyle = isOverdrive ? "#ff8888" : ball.color;
    if(isOverdrive){
      ctx.shadowBlur = 20;
      ctx.shadowColor = "red";
    }
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Particles
  for(let p of particles){
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1.0;

  ctx.restore();

  requestAnimationFrame(() => {
    update();
    draw();
  });
}

loadLoadout();
updateLoadoutUI();
updateCoinsUI();

openShopBtn.addEventListener('click', openShop);
closeShopBtn.addEventListener('click', closeShop);

function openShop(){
  shopOverlay.style.display = "block";
  openShopBtn.disabled = true;
  pauseGameWhileShop(true);
  createShopItems(ballSelection, balls, currentBall.id, true);
  createShopItems(racquetSelection, racquets, currentRacquet.id, false);
  highlightSelected();
}
function closeShop(){
  shopOverlay.style.display = "none";
  openShopBtn.disabled = false;
  pauseGameWhileShop(false);
  canvas.focus();
}
function pauseGameWhileShop(pause){
  if(pause){
    for(let k in keys) keys[k] = false;
  }
}

document.addEventListener('keydown', e => {
  if(e.code === 'Space'){
    if(!gameRunning) resetGame();
    else attemptSwing();
    e.preventDefault();
  }
  if(keys.hasOwnProperty(e.code) || e.key === "Shift"){
    keys[e.code] = true;
    if(e.key === "Shift") keys.Shift = true;
  }
  if(e.code === "KeyW") keys.KeyW = true;
  if(e.code === "KeyA") keys.KeyA = true;
  if(e.code === "KeyD") keys.KeyD = true;

  if(e.key === 'Escape' && shopOverlay.style.display === 'block'){
    closeShop();
  }
});
document.addEventListener('keyup', e => {
  if(keys.hasOwnProperty(e.code) || e.key === "Shift"){
    keys[e.code] = false;
    if(e.key === "Shift") keys.Shift = false;
  }
  if(e.code === "KeyW") keys.KeyW = false;
  if(e.code === "KeyA") keys.KeyA = false;
  if(e.code === "KeyD") keys.KeyD = false;
});

// Start game loop
draw();
</script>
