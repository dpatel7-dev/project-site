<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Voids | 0 Cost Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d0d0d;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none; /* Prevents zooming on mobile taps */
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            pointer-events: none;
            text-shadow: 0 0 10px #ff00de;
        }
        h1 { font-size: 40px; margin: 0; letter-spacing: 5px; }
        p { font-size: 18px; color: #00ffea; }
        #scoreBoard {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="scoreBoard">SCORE: 0 | BEST: 0</div>
    <div id="ui">
        <h1>NEON VOIDS</h1>
        <p>Press SPACE or TAP to Reverse Gravity</p>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        // --- ENGINEER'S NOTE: VANILLA JS FOR PERFORMANCE ---
        // No libraries means this loads in <50ms. 
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('ui');
        const scoreEl = document.getElementById('scoreBoard');

        // State Management
        let width, height;
        let gameRunning = false;
        let frameId;
        let score = 0;
        let highScore = localStorage.getItem('neonVoidsHigh') || 0;
        let speed = 6;
        let difficultyMultiplier = 0.001;

        // Player Entity
        const player = {
            x: 50,
            y: 0,
            size: 30,
            color: '#00ffea',
            vy: 0,
            gravity: 0.8,
            isGrounded: false,
            inverted: false
        };

        // Obstacles Array
        let obstacles = [];
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            player.y = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- CORE MECHANICS ---

        function startGame() {
            if (gameRunning) return;
            gameRunning = true;
            ui.style.display = 'none';
            obstacles = [];
            particles = [];
            score = 0;
            speed = 6;
            player.y = height / 2;
            player.vy = 0;
            animate();
        }

        function resetGame() {
            gameRunning = false;
            cancelAnimationFrame(frameId);
            ui.style.display = 'block';
            ui.innerHTML = `<h1>GAME OVER</h1><p>Score: ${Math.floor(score)}</p><p>Press SPACE/TAP to try again</p>`;
            
            // Backend-style persistence logic:
            if (score > highScore) {
                highScore = Math.floor(score);
                localStorage.setItem('neonVoidsHigh', highScore);
            }
            updateScoreUI();
        }

        function switchGravity() {
            if (!gameRunning) {
                startGame();
                return;
            }
            player.gravity = -player.gravity;
            player.inverted = !player.inverted;
            createParticles(player.x, player.y, 10, '#fff'); // Visual feedback
        }

        // Input Listeners
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') switchGravity();
        });
        window.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            switchGravity();
        });

        // --- GAME LOOP ---
        
        function update() {
            // Speed scaling (makes it harder over time)
            speed += difficultyMultiplier;
            score += 0.1;

            // Player Physics
            player.vy += player.gravity;
            player.y += player.vy;

            // Floor/Ceiling collision
            if (player.y + player.size > height) {
                player.y = height - player.size;
                player.vy = 0;
                gameOver();
            } else if (player.y < 0) {
                player.y = 0;
                player.vy = 0;
                gameOver();
            }

            // Obstacle Spawning Logic
            if (Math.random() < 0.02 + (score * 0.00001)) {
                const isTop = Math.random() > 0.5;
                const h = Math.random() * (height / 2.5) + 50;
                obstacles.push({
                    x: width,
                    y: isTop ? 0 : height - h,
                    w: 40 + Math.random() * 40,
                    h: h,
                    color: '#ff00de'
                });
            }

            // Obstacle Update & Collision
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= speed;

                // Collision Detection (AABB)
                if (
                    player.x < obs.x + obs.w &&
                    player.x + player.size > obs.x &&
                    player.y < obs.y + obs.h &&
                    player.y + player.size > obs.y
                ) {
                    gameOver();
                }

                // Remove off-screen
                if (obs.x + obs.w < 0) obstacles.splice(i, 1);
            }

            // Particles Update
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            // Trail effect (expensive but looks cool, keeping optimization in mind)
            ctx.fillStyle = 'rgba(13, 13, 13, 0.3)';
            ctx.fillRect(0, 0, width, height);

            // Draw Player
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.fillRect(player.x, player.y, player.size, player.size);
            ctx.shadowBlur = 0;

            // Draw Obstacles
            ctx.fillStyle = '#ff00de';
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            });

            // Draw Particles
            particles.forEach(p => {
                ctx.fillStyle = `rgba(255, 255, 255, ${p.life})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            updateScoreUI();
        }

        function createParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x + player.size/2,
                    y: y + player.size/2,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 1.0,
                    size: Math.random() * 3
                });
            }
        }

        function updateScoreUI() {
            scoreEl.innerText = `SCORE: ${Math.floor(score)} | BEST: ${highScore}`;
        }

        function gameOver() {
            createParticles(player.x, player.y, 50, '#ff0000'); // Explosion
            resetGame();
        }

        function animate() {
            if (!gameRunning) return;
            update();
            draw();
            frameId = requestAnimationFrame(animate);
        }

        // Initialize display
        updateScoreUI();

    </script>
</body>
</html>
