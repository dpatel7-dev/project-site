<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALGEBRA DASH</title>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Russo One', sans-serif;
            color: white;
            user-select: none;
        }
        canvas {
            box-shadow: 0 0 60px rgba(0, 255, 200, 0.2);
            border-top: 4px solid #0ff;
            border-bottom: 4px solid #0ff;
            background: #000;
            transition: border-color 1s;
        }
        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        #scoreVal {
            font-size: 72px;
            color: #fff;
            text-shadow: 4px 4px 0px #0ff;
            font-style: italic;
        }
        #levelIdx {
            font-size: 24px;
            color: #aaa;
            letter-spacing: 5px;
        }
        #start-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            background: rgba(0, 20, 20, 0.95);
            padding: 40px;
            border: 2px solid #0ff;
            box-shadow: 0 0 50px #0ff;
            transform: skew(-10deg);
        }
        .controls {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
        .tagline {
            color: #f05;
            font-size: 14px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        /* Dynamic HUD classes */
        .phase-1 { color: #0ff; text-shadow: 4px 4px 0 #005555; }
        .phase-2 { color: #ff0; text-shadow: 4px 4px 0 #aa5500; }
        .phase-3 { color: #f05; text-shadow: 4px 4px 0 #550000; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="scoreVal" class="phase-1">0</div>
        <div id="levelIdx">PHASE 1</div>
    </div>

    <div id="start-msg">
        <h1 style="font-size: 48px; margin: 0; line-height: 1;">ALGEBRA DASH</h1>
        <p class="tagline">ANTI-CHEAT ENABLED</p>
        <div class="controls">
            CLICK / SPACE :: FLIP GRAVITY<br>
            SHIFT / R-CLICK :: SONIC DASH
        </div>
        <br>
        <h2 style="cursor: pointer; color: #fff; border: 1px solid #fff; padding: 10px; display: inline-block;">ENGAGE</h2>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script>
        /**
         * GAME CODER ENGINE: HYPERFLUX v2.0
         * Changelog:
         * - Implemented Grounded-Check Anti-Cheat (Prevents hover exploit).
         * - Added Dynamic Difficulty Scaling (Phases).
         */
        'use strict';

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('scoreVal');
        const levelEl = document.getElementById('levelIdx');
        const startMsg = document.getElementById('start-msg');

        const CONFIG = {
            width: 900,
            height: 500,
            playerSize: 30,
            gravityForce: 0.31,
            baseSpeed: 10.8,
            dashSpeedMult: 1.6,
            dashDuration: 10,
            dashCooldown: 50,
            railHeight: 50,
            colors: {
                bg: '#000505',
                player: '#ffffff',
                playerShadow: '#00ffff',
                spike: '#ff0055',
                spikeShadow: '#ff0000'
            }
        };

        let state = {
            running: false,
            over: false,
            score: 0,
            speed: CONFIG.baseSpeed,
            frames: 0,
            shake: 0,
            phase: 1
        };

        const player = {
            x: 120,
            y: CONFIG.height - 60,
            gravityDir: 1,
            trail: [],
            isDashing: false,
            dashTimer: 0,
            cooldownTimer: 5,
            // ANTI-CHEAT: Grounded check
            isGrounded: true 
        };

        let obstacles = [];
        let particles = [];
        let speedLines = [];

        function init() {
            resize();
            window.addEventListener('resize', resize);
            window.addEventListener('contextmenu', e => e.preventDefault());
            
            // Initial ambient particles
            for(let i=0; i<20; i++) {
                speedLines.push({
                    x: Math.random() * CONFIG.width,
                    y: Math.random() * CONFIG.height,
                    w: 20 + Math.random() * 100,
                    speed: 15 + Math.random() * 10
                });
            }
            
            loop();
        }

        function resize() {
            let scale = Math.min(window.innerWidth / CONFIG.width, window.innerHeight / CONFIG.height);
            canvas.width = CONFIG.width;
            canvas.height = CONFIG.height;
            canvas.style.width = (CONFIG.width * scale * 0.95) + 'px';
            canvas.style.height = (CONFIG.height * scale * 0.95) + 'px';
        }

        function resetGame() {
            state.score = 0;
            state.speed = CONFIG.baseSpeed;
            state.frames = 0;
            state.over = false;
            state.running = true;
            state.shake = 0;
            state.phase = 1;
            
            updatePhaseVisuals(1);
            
            player.y = CONFIG.height - CONFIG.playerSize - CONFIG.railHeight;
            player.gravityDir = 1;
            player.trail = [];
            player.isDashing = false;
            player.cooldownTimer = 0;
            player.isGrounded = true;
            
            obstacles = [];
            particles = [];
            startMsg.style.display = 'none';
        }

        // --- INPUT ---
        function handleInput(type) {
            if (state.over && state.shake <= 0) { resetGame(); return; }
            if (!state.running) { resetGame(); return; }

            if (type === 'flip') {
                // ANTI-CHEAT: 
                // Only allow flip if player is touching (or very close to) a rail.
                // This prevents spam-clicking in mid-air to hover.
                if (player.isGrounded) {
                    player.gravityDir *= -1;
                    player.isGrounded = false; // Player is now airborne
                    createExplosion(player.x, player.y, 5, CONFIG.colors.playerShadow);
                }
            } else if (type === 'dash') {
                if (player.cooldownTimer <= 0 && !player.isDashing) {
                    player.isDashing = true;
                    player.dashTimer = CONFIG.dashDuration;
                    player.cooldownTimer = CONFIG.dashCooldown;
                    state.shake = 10;
                    createExplosion(player.x, player.y, 20, '#fff');
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') handleInput('flip');
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') handleInput('dash');
        });
        document.addEventListener('mousedown', (e) => {
            if (e.button === 0) handleInput('flip');
            if (e.button === 2) handleInput('dash');
        });
        document.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput('flip'); }, {passive: false});

        // --- LOGIC ---
        function updatePhaseVisuals(phase) {
            scoreEl.className = `phase-${phase}`;
            if (phase === 1) {
                CONFIG.colors.playerShadow = '#00ffff';
                canvas.style.borderColor = '#0ff';
                levelEl.innerText = "PHASE 1: STABLE";
            } else if (phase === 2) {
                CONFIG.colors.playerShadow = '#ffff00';
                canvas.style.borderColor = '#ff0';
                levelEl.innerText = "PHASE 2: UNSTABLE";
            } else {
                CONFIG.colors.playerShadow = '#ff0055';
                canvas.style.borderColor = '#f05';
                levelEl.innerText = "PHASE 3: CRITICAL";
            }
        }

        function update() {
            if (!state.running) return;

            state.frames++;
            let currentSpeed = player.isDashing ? state.speed * CONFIG.dashSpeedMult : state.speed;

            // --- LEVEL PROGRESSION SYSTEM ---
            if (state.score > 1000 && state.phase === 1) {
                state.phase = 2;
                state.speed += 1.3; // Speed Bump
                state.shake = 20; // Visual cue
                updatePhaseVisuals(2);
            }
            if (state.score > 2000 && state.phase === 2) {
                state.phase = 3;
                state.speed += 1.7; // Massive Speed Bump
                state.shake = 30;
                updatePhaseVisuals(3);
            }

            // Physics & Collision Logic
            let floorLimit = CONFIG.height - CONFIG.playerSize - CONFIG.railHeight;
            let ceilLimit = CONFIG.railHeight;
            let targetY = (player.gravityDir > 0) ? floorLimit : ceilLimit;
            
            // Standard Lerp
            player.y += (targetY - player.y) * CONFIG.gravityForce;
            
            // Clamp & Ground Check
            // We consider the player "Grounded" if they are within 1px of their target
            // This re-enables the ability to flip.
            if (Math.abs(player.y - targetY) < 1.0) {
                player.y = targetY; // Snap to rail
                player.isGrounded = true;
            } else {
                player.isGrounded = false;
            }

            if (player.y > floorLimit) player.y = floorLimit;
            if (player.y < ceilLimit) player.y = ceilLimit;

            // Trail Logic
            if (state.frames % 2 === 0) {
                player.trail.push({x: player.x, y: player.y});
                if (player.trail.length > 20) player.trail.shift();
            }

            // Dash timers
            if (player.isDashing) {
                player.dashTimer--;
                if (player.dashTimer <= 0) player.isDashing = false;
            }
            if (player.cooldownTimer > 0) player.cooldownTimer--;

            // Score & Speed Ramp (Subtle natural ramp)
            state.score += 1;
            scoreEl.innerText = state.score;
            if (state.frames % 300 === 0) state.speed += 0.2;

            // Speed Lines
            speedLines.forEach(line => {
                line.x -= line.speed + (state.speed - CONFIG.baseSpeed);
                if (line.x < -200) {
                    line.x = CONFIG.width + Math.random() * 200;
                    line.y = Math.random() * CONFIG.height;
                }
            });

            // --- PATTERN SPAWNER ---
            // Adjusted for Phase Difficulty
            let spawnFreq = Math.max(20, Math.floor(600 / state.speed));
            
            if (state.frames % spawnFreq === 0) {
                let pattern = Math.random();
                
                if (state.phase === 1) {
                    // Easy Patterns
                    if (pattern < 0.5) spawnSpike(CONFIG.width, Math.random() > 0.5);
                    else {
                        spawnSpike(CONFIG.width, true);
                        spawnSpike(CONFIG.width + 150, false);
                    }
                } 
                else if (state.phase === 2) {
                    // Harder Patterns (Walls)
                    if (pattern < 0.4) {
                        spawnSpike(CONFIG.width, true);
                        spawnSpike(CONFIG.width + 120, false);
                    } else if (pattern < 0.7) {
                        spawnSpike(CONFIG.width, true);
                        spawnSpike(CONFIG.width + 100, true);
                        spawnSpike(CONFIG.width + 200, false);
                    } else {
                        spawnSpike(CONFIG.width, Math.random() > 0.5);
                    }
                } 
                else {
                    // Phase 3: CHAOS (Sawtooths)
                    spawnSpike(CONFIG.width, true);
                    spawnSpike(CONFIG.width + 250, false);
                    spawnSpike(CONFIG.width + 500, true);
                }
            }

            // --- OBSTACLE LOOP ---
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= currentSpeed;

                let inset = 8;
                if (
                    player.x + inset < obs.x + obs.w - inset &&
                    player.x + CONFIG.playerSize - inset > obs.x + inset &&
                    player.y + inset < obs.y + obs.h - inset &&
                    player.y + CONFIG.playerSize - inset > obs.y + inset
                ) {
                    if (player.isDashing) {
                        obstacles.splice(i, 1);
                        state.shake = 10;
                        createExplosion(obs.x, obs.y + obs.h/2, 10, '#f05');
                        state.score += 50;
                    } else {
                        triggerDeath();
                    }
                }
                if (obs.x < -100) obstacles.splice(i, 1);
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (state.shake > 0) state.shake *= 0.9;
        }

        function spawnSpike(xOffset, isBottom) {
            let spikeH = 80;
            let spikeW = 40;
            let yPos = isBottom ? (CONFIG.height - CONFIG.railHeight - spikeH) : CONFIG.railHeight;

            obstacles.push({
                x: xOffset,
                y: yPos,
                w: spikeW,
                h: spikeH,
                isBottom: isBottom
            });
        }

        function createExplosion(x, y, count, color) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x + CONFIG.playerSize/2, y: y + CONFIG.playerSize/2,
                    vx: (Math.random()-0.5) * 20,
                    vy: (Math.random()-0.5) * 20,
                    life: 1.0, color: color
                });
            }
        }

        function triggerDeath() {
            state.running = false;
            state.over = true;
            state.shake = 40;
            createExplosion(player.x, player.y, 50, '#fff');
            startMsg.innerHTML = `
                <h1 style="color:#f05; font-size:60px">WIPEOUT</h1>
                <h2 style="color:#fff">SCORE: ${state.score}</h2>
                <div style="font-size:12px; color:#aaa; margin-top:10px">PHASE ${state.phase} REACHED</div>
                <p class="controls">CLICK TO RESTART</p>`;
            startMsg.style.display = 'block';
        }

        // --- RENDER ---
        function draw() {
            ctx.save();
            if (state.shake > 0) {
                ctx.translate((Math.random()-0.5)*state.shake, (Math.random()-0.5)*state.shake);
            }

            // Background
            ctx.fillStyle = CONFIG.colors.bg;
            ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

            // Phase indicator background effect
            if (state.phase === 3) {
                 ctx.fillStyle = 'rgba(255, 0, 85, 0.05)';
                 ctx.fillRect(0,0, CONFIG.width, CONFIG.height);
            }

            // Speed Lines
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            speedLines.forEach(line => {
                ctx.fillRect(line.x, line.y, line.w, 2);
            });

            // Rails
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, CONFIG.width, CONFIG.railHeight);
            ctx.fillRect(0, CONFIG.height - CONFIG.railHeight, CONFIG.width, CONFIG.railHeight);
            
            // Neon Rail Line (changes color with phase)
            ctx.fillStyle = CONFIG.colors.playerShadow;
            ctx.shadowBlur = 10;
            ctx.shadowColor = CONFIG.colors.playerShadow;
            ctx.fillRect(0, CONFIG.railHeight - 2, CONFIG.width, 2);
            ctx.fillRect(0, CONFIG.height - CONFIG.railHeight, CONFIG.width, 2);
            ctx.shadowBlur = 0;

            // Player Trail
            player.trail.forEach((pos, i) => {
                let alpha = i / player.trail.length;
                ctx.fillStyle = state.phase === 3 ? `rgba(255, 0, 85, ${alpha*0.4})` : `rgba(0, 255, 255, ${alpha * 0.4})`;
                ctx.fillRect(pos.x - (20 * (1-alpha)), pos.y, CONFIG.playerSize + (20 * (1-alpha)), CONFIG.playerSize);
            });

            // Player
            if (state.running) {
                let pColor = player.isDashing ? '#fff' : CONFIG.colors.player;
                ctx.fillStyle = pColor;
                ctx.shadowBlur = 20;
                ctx.shadowColor = CONFIG.colors.playerShadow;
                
                ctx.save();
                ctx.translate(player.x, player.y);
                // Slight tilt based on gravity
                ctx.transform(1, 0, -0.4 * player.gravityDir, 1, 0, 0); 
                ctx.fillRect(0, 0, CONFIG.playerSize, CONFIG.playerSize);
                
                if (player.isDashing) {
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-5, -5, CONFIG.playerSize+10, CONFIG.playerSize+10);
                }
                ctx.restore();
            }

            // Obstacles
            obstacles.forEach(obs => {
                ctx.fillStyle = CONFIG.colors.spike;
                ctx.shadowBlur = 20;
                ctx.shadowColor = CONFIG.colors.spikeShadow;
                
                ctx.beginPath();
                if (obs.isBottom) {
                    ctx.moveTo(obs.x, obs.y + obs.h);
                    ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
                    ctx.lineTo(obs.x + obs.w/2 - 5, obs.y);
                } else {
                    ctx.moveTo(obs.x, obs.y);
                    ctx.lineTo(obs.x + obs.w, obs.y);
                    ctx.lineTo(obs.x + obs.w/2 - 5, obs.y + obs.h);
                }
                ctx.fill();
            });

            // Particles
            ctx.globalCompositeOperation = 'lighter';
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 4, 4);
            });
            
            // HUD Dash Bar
            if (player.cooldownTimer > 0) {
                let pct = player.cooldownTimer / CONFIG.dashCooldown;
                ctx.fillStyle = '#333';
                ctx.fillRect(CONFIG.width/2 - 50, 60, 100, 4);
                ctx.fillStyle = '#f05';
                ctx.fillRect(CONFIG.width/2 - 50, 60, 100 * (1-pct), 4);
            } else if (state.running) {
                ctx.fillStyle = CONFIG.colors.playerShadow;
                ctx.font = '10px Russo One';
                ctx.fillText("DASH READY", CONFIG.width/2 - 30, 65);
            }

            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;
            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        init();

    </script>
</body>
</html>
