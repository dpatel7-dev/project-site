<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNAR LANDER</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --c-dark: #1d2b53;
            --c-sky: #29adff; 
            --c-ground: #ab5236;
            --c-highlight: #ffccaa;
            --c-white: #fff1e8;
            --c-accent: #ff004d;
            --c-ui-bg: #292929;
            --c-key: #444;
        }

        body {
            margin: 0;
            background-color: #121212;
            color: var(--c-white);
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-cabinet {
            background-color: var(--c-ui-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.8),
                inset 0 2px 0 rgba(255,255,255,0.1);
            border-bottom: 8px solid #111;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* --- HUD --- */
        .hud-panel {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 12px;
            background: #000;
            border: 2px solid #555;
            color: #83769c;
            font-size: 10px;
            text-transform: uppercase;
        }

        .hud-value {
            color: var(--c-white);
            font-size: 14px;
            margin-top: 5px;
        }

        .fuel-container {
            width: 120px;
            height: 12px;
            background: #333;
            margin-top: 5px;
            border: 2px solid #fff;
            padding: 2px;
        }

        .fuel-fill {
            height: 100%;
            background: var(--c-accent);
            width: 100%;
            transition: width 0.1s;
        }

        /* --- SCREEN --- */
        .canvas-wrapper {
            position: relative;
            border: 4px solid var(--c-white);
            background: #000;
            line-height: 0;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        /* --- CONTROLS STRIP (NEW) --- */
        .controls-panel {
            display: flex;
            justify-content: center;
            gap: 40px;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #444;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 10px;
            color: #aaa;
        }

        .key-cap {
            background: var(--c-key);
            border-bottom: 3px solid #222;
            border-radius: 4px;
            padding: 8px 10px;
            color: #fff;
            font-size: 12px;
            box-shadow: 0 2px 0 #000;
        }

        /* --- MENUS --- */
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(29, 43, 83, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }

        .hidden { display: none !important; }

        h1 { font-size: 24px; color: var(--c-highlight); margin-bottom: 20px; text-shadow: 3px 3px 0 #000; }
        p { font-size: 10px; line-height: 1.8; color: #fff; margin-bottom: 25px; max-width: 80%; }

        button {
            font-family: 'Press Start 2P', cursive;
            background: var(--c-accent);
            border: none;
            border-bottom: 4px solid #7a0026;
            color: #fff;
            padding: 15px 20px;
            font-size: 12px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active {
            transform: translateY(2px);
            border-bottom: 2px solid #7a0026;
        }

        button:hover {
            filter: brightness(1.1);
        }

        .status-ok { color: #00e756; }
        .status-warn { color: #ffccaa; }
        .status-danger { color: #ff004d; }

    </style>
</head>
<body>

    <div id="game-cabinet">
        
        <div class="hud-panel">
            <div>
                <div>FUEL LEVEL</div>
                <div class="fuel-container"><div class="fuel-fill" id="fuel-bar"></div></div>
            </div>
            <div style="text-align: right;">
                <div>Vertical Speed</div>
                <div id="v-speed" class="hud-value">0.00</div>
            </div>
            <div style="text-align: right;">
                <div>Altitude</div>
                <div id="altitude" class="hud-value">000</div>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            
            <div id="start-menu" class="overlay-screen">
                <h1>PIXEL LANDER</h1>
                <p>MISSION: Pilot the module to the BLUE PAD.</p>
                <button id="start-btn">START ENGINE</button>
            </div>

            <div id="game-over-menu" class="overlay-screen hidden">
                <h1 id="end-title">CRASHED</h1>
                <p id="end-reason">SPEED TOO HIGH</p>
                <button id="retry-btn">RETRY MISSION</button>
            </div>
        </div>

        <div class="controls-panel">
            <div class="control-group">
                <div class="key-cap">↑</div>
                <span>THRUST</span>
            </div>
            <div class="control-group">
                <div class="key-cap">←</div>
                <div class="key-cap">→</div>
                <span>ROTATE</span>
            </div>
        </div>

    </div>

    <script>
        /**
         * PIXEL LANDER v2
         * Easier difficulty settings applied.
         */
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.ctx.imageSmoothingEnabled = false;

                this.width = 800;
                this.height = 600;

                // --- TUNED PHYSICS FOR EASIER GAMEPLAY ---
                this.GRAVITY = 0.035;       // Reduced from 0.04 (Slower fall)
                this.THRUST = 0.12;         // Increased from 0.09 (Stronger engine)
                this.ROTATION_SPEED = 0.07;
                this.SAFE_VELOCITY = 2.8;   // Increased from 2.0 (Harder landings allowed)

                this.running = false;
                this.terrain = [];
                this.stars = [];
                this.particles = [];
                
                this.keys = { ArrowUp: false, ArrowLeft: false, ArrowRight: false };
                this.ship = {};
                this.pad = {};

                window.addEventListener('keydown', e => this.keys[e.code] = true);
                window.addEventListener('keyup', e => this.keys[e.code] = false);

                this.initStars();
                this.loop = this.loop.bind(this);
                this.drawBackground();
            }

            initStars() {
                this.stars = [];
                for(let i=0; i<80; i++) {
                    this.stars.push({
                        x: Math.random() * this.width,
                        y: Math.random() * this.height,
                        size: Math.random() > 0.9 ? 3 : 2,
                    });
                }
            }

            reset() {
                this.ship = {
                    x: 100, y: 50,
                    vx: 1.5, vy: 0,
                    angle: -Math.PI / 2,
                    fuel: 100,
                    alive: true,
                    landed: false
                };
                
                this.terrain = [];
                let y = 450;
                const segWidth = 40;
                const segments = this.width / segWidth;
                
                // Make the pad slightly wider for easier targeting
                const padIndex = Math.floor(Math.random() * (segments - 8)) + 4;
                const padWidth = 4; // Wider pad

                this.pad = {
                    xStart: padIndex * segWidth,
                    xEnd: (padIndex + padWidth) * segWidth,
                    y: 0
                };

                for(let i=0; i <= segments; i++) {
                    let x = i * segWidth;
                    if (i >= padIndex && i <= padIndex + padWidth) {
                        if (i === padIndex) this.pad.y = y;
                        y = this.pad.y;
                    } else {
                        y += (Math.random() - 0.5) * 80;
                        y = Math.max(200, Math.min(550, y));
                    }
                    this.terrain.push({x, y});
                }

                this.particles = [];
                this.running = true;
                
                document.getElementById('start-menu').classList.add('hidden');
                document.getElementById('game-over-menu').classList.add('hidden');
                
                this.loop();
            }

            update() {
                if(!this.running) return;

                this.ship.vy += this.GRAVITY;

                if (this.keys.ArrowLeft) this.ship.angle -= this.ROTATION_SPEED;
                if (this.keys.ArrowRight) this.ship.angle += this.ROTATION_SPEED;

                if (this.keys.ArrowUp && this.ship.fuel > 0) {
                    this.ship.fuel -= 0.2; // Reduced fuel consumption
                    this.ship.vx += Math.cos(this.ship.angle) * this.THRUST;
                    this.ship.vy += Math.sin(this.ship.angle) * this.THRUST;
                    
                    this.createParticles(
                        this.ship.x - Math.cos(this.ship.angle) * 15,
                        this.ship.y - Math.sin(this.ship.angle) * 15,
                        2, 
                        ['#ffccaa', '#ff004d']
                    );
                }

                this.ship.x += this.ship.vx;
                this.ship.y += this.ship.vy;

                if (this.ship.x > this.width) this.ship.x = 0;
                if (this.ship.x < 0) this.ship.x = this.width;

                const segWidth = 40;
                const idx = Math.floor(this.ship.x / segWidth);
                
                if (idx >= 0 && idx < this.terrain.length - 1) {
                    const p1 = this.terrain[idx];
                    const p2 = this.terrain[idx+1];
                    const t = (this.ship.x - p1.x) / segWidth;
                    const groundY = p1.y + t * (p2.y - p1.y);

                    if (this.ship.y + 10 >= groundY) {
                        this.ship.y = groundY - 10;
                        this.checkLanding(groundY);
                    }
                }

                this.particles.forEach((p, i) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.03;
                    if(p.life <= 0) this.particles.splice(i, 1);
                });

                // HUD Updates
                const vEl = document.getElementById('v-speed');
                vEl.innerText = this.ship.vy.toFixed(2);
                
                if(Math.abs(this.ship.vy) > this.SAFE_VELOCITY) {
                    vEl.className = 'hud-value status-danger';
                } else {
                    vEl.className = 'hud-value status-ok';
                }

                const altEl = document.getElementById('altitude');
                altEl.innerText = Math.floor(600 - this.ship.y);

                const fuelBar = document.getElementById('fuel-bar');
                fuelBar.style.width = this.ship.fuel + "%";
                if(this.ship.fuel < 30) fuelBar.style.backgroundColor = '#ff004d';
                else fuelBar.style.backgroundColor = '#ffccaa';
            }

            checkLanding(groundY) {
                this.running = false;
                
                // Using 40 as segment width logic
                const idx = Math.floor(this.ship.x / 40);
                // Check if current segment is flat (Landing Pad)
                const isFlat = Math.abs(this.terrain[idx].y - this.terrain[idx+1].y) < 2;
                
                const isSlow = Math.abs(this.ship.vy) < this.SAFE_VELOCITY;
                const isUpright = Math.abs(Math.cos(this.ship.angle)) < 0.35; 

                const title = document.getElementById('end-title');
                const reason = document.getElementById('end-reason');
                
                if(isFlat && isSlow && isUpright) {
                    this.ship.landed = true;
                    title.innerText = "SUCCESS";
                    title.style.color = "#00e756";
                    reason.innerText = "EXCELLENT LANDING";
                    reason.style.color = "#fff";
                } else {
                    this.ship.alive = false;
                    this.createParticles(this.ship.x, this.ship.y, 60, ['#ff004d', '#ffccaa', '#fff']);
                    title.innerText = "DESTROYED";
                    title.style.color = "#ff004d";
                    
                    if(!isFlat) reason.innerText = "MISSED THE PAD";
                    else if(!isSlow) reason.innerText = "TOO FAST";
                    else if(!isUpright) reason.innerText = "BAD ANGLE";
                }

                setTimeout(() => {
                    document.getElementById('game-over-menu').classList.remove('hidden');
                }, 1000);
            }

            createParticles(x, y, count, colors) {
                for(let i=0; i<count; i++) {
                    this.particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 6,
                        vy: (Math.random() - 0.5) * 6,
                        life: 1.0,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        size: Math.random() * 4 + 2
                    });
                }
            }

            drawBackground() {
                this.ctx.fillStyle = '#1d2b53'; 
                this.ctx.fillRect(0, 0, this.width, this.height);
                this.ctx.fillStyle = '#fff1e8';
                this.stars.forEach(s => {
                   if (Math.random() > 0.05) this.ctx.fillRect(s.x, s.y, s.size, s.size);
                });
            }

            draw() {
                this.drawBackground();

                this.ctx.fillStyle = '#ab5236';
                this.ctx.beginPath();
                this.ctx.moveTo(0, 600);
                this.terrain.forEach(p => this.ctx.lineTo(p.x, p.y));
                this.ctx.lineTo(800, 600);
                this.ctx.closePath();
                this.ctx.fill();

                this.ctx.fillStyle = '#29adff';
                this.ctx.fillRect(this.pad.xStart, this.pad.y, this.pad.xEnd - this.pad.xStart, 10);

                if (this.ship.alive) {
                    this.ctx.save();
                    this.ctx.translate(this.ship.x, this.ship.y);
                    this.ctx.rotate(this.ship.angle + Math.PI/2);
                    
                    this.ctx.fillStyle = '#fff1e8';
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, -12);
                    this.ctx.lineTo(-8, 8);
                    this.ctx.lineTo(8, 8);
                    this.ctx.closePath();
                    this.ctx.fill();

                    this.ctx.fillStyle = '#1d2b53';
                    this.ctx.fillRect(-2, -2, 4, 4);

                    this.ctx.fillStyle = '#ff004d';
                    this.ctx.fillRect(-8, 4, 3, 6);
                    this.ctx.fillRect(5, 4, 3, 6);
                    this.ctx.restore();
                }

                this.particles.forEach(p => {
                    this.ctx.fillStyle = p.color;
                    this.ctx.globalAlpha = p.life;
                    this.ctx.fillRect(p.x, p.y, p.size, p.size);
                    this.ctx.globalAlpha = 1.0;
                });
            }

            loop() {
                this.update();
                this.draw();
                if(this.running || this.particles.length > 0) requestAnimationFrame(this.loop);
            }
        }

        const game = new Game();
        document.getElementById('start-btn').addEventListener('click', () => game.reset());
        document.getElementById('retry-btn').addEventListener('click', () => game.reset());
    </script>
</body>
</html>
