<script>
  // light or dark before anything is drawn, so nothing flashes
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('diceweb') || '{}'), look = s.look || 'auto', n;
      if (look === 'night') n = true; else if (look === 'day') n = false;
      else { var d = new Date(), y = d.getFullYear(), k = Math.floor((d - new Date(y, 0, 0)) / 864e5), e = 23.44 * Math.sin(2 * Math.PI * (284 + k) / 365) * Math.PI / 180,
        h = Math.acos(Math.max(-1, Math.min(1, -Math.tan(0.698) * Math.tan(e)))) * 12 / Math.PI,
        st = d.getTimezoneOffset() < Math.max(new Date(y, 0, 1).getTimezoneOffset(), new Date(y, 6, 1).getTimezoneOffset()) ? 1 : 0, t = d.getHours() + d.getMinutes() / 60;
        n = t < 12 + st - h || t >= 12 + st + h; }
      document.documentElement.setAttribute('data-look', n ? 'dark' : 'light');
    } catch (e) { /* the default is fine */ }
  })();
</script>
