<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's new - djp7</title>
<meta name="description" content="The newest version of every app, and what changed.">
<style>
  /* Every app's latest changes, one after another, each beside its mascot
     standing on a patch of its own colour. */
  .wrap.narrow { max-width: 900px; }
  h1 { font: 700 clamp(2.5rem, 6vw, 4rem)/1 var(--pixel); margin: clamp(40px, 8vh, 80px) 0 14px; letter-spacing: -.02em; }
  .lede { color: var(--muted); margin: 0 0 34px; font-size: 1.2rem; max-width: 34em; }
  .news { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 0 26px; padding: 30px 0; border-top: 1px solid var(--line); }
  .news .patch { grid-row: span 3; height: 88px; border-radius: 18px; display: grid; place-items: end center; padding-bottom: 14px;
    background: linear-gradient(transparent 74%, color-mix(in oklab, var(--c) 70%, #fff) 74% 77%, var(--c) 77%), color-mix(in oklab, var(--c) 22%, var(--bg)); }
  .news header { font: 700 1.6rem/1.2 var(--pixel); display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
  .news header a { text-decoration: none; }
  .news header a:hover { text-decoration: underline; }
  .news header span { font: 700 .8rem/1 var(--read); color: #141416; background: var(--c); padding: 5px 8px; border-radius: 7px; }
  .news p { margin: 8px 0 0; font-weight: 700; }
  .news ul { margin: 10px 0 0; padding: 0; list-style: none; color: var(--muted); display: grid; gap: 10px; }
  .news li { position: relative; padding-left: 22px; }
  .news li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 7px; height: 7px; background: var(--c); }
  .news li b { color: var(--ink); }
  .tip { margin: 26px 0 0; padding: 18px 22px; border-radius: 22px; background: var(--soft); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
  .tip b { color: var(--ink); }
  @media (max-width: 600px) { .news { grid-template-columns: 1fr; } .news .patch { grid-row: auto; width: 112px; margin-bottom: 14px; } }
</style>
</head>
<body>
<main class="wrap narrow">
  <h1>What's new</h1>
  <p class="lede">The newest version of every app, with the most recent changes first.</p>
  <div id="news">{{news}}</div>
  <p class="tip"><b>Getting the new versions:</b> open <b>pca</b> and it updates everything by itself. Or type an app's name and then <b>update</b>, like <b>tidy update</b>.</p>
</main>
<script>
{{art}}
(function () {
  const APPS = {{apps_json}};
  const byId = {};
  APPS.forEach((a) => { byId[a.id] = a; });
  document.querySelectorAll('.news').forEach((el) => {
    const a = byId[el.dataset.app];
    if (!a) return;
    el.style.setProperty('--c', a.c);
    const patch = document.createElement('span');
    patch.className = 'patch';
    patch.setAttribute('aria-hidden', 'true');
    el.prepend(patch);
    const m = ART.mascots[a.id];
    if (m) patch.appendChild(drawPixels(document.createElement('canvas'), trimGrid(m.grid), m.ink, 3));
    else if (a.icon) { const img = new Image(); img.src = a.icon; img.alt = ''; img.className = 'pix'; img.onload = () => { img.width = img.naturalWidth * 3; }; patch.appendChild(img); }
  });
})();
</script>
</body>
</html>
