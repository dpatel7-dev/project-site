<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's new - djp7</title>
<meta name="description" content="The latest changes to morph, scout, den, pigeon, roomy, hey, tidy, Tree of Thought, gossip and Project CLI Access.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2f4f8; --card: #fff; --ink: #1a1d29; --muted: #5a6175; --line: #dde1ea;
    --pixel: "Pixelify Sans", ui-monospace, monospace;
    --sans: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 400 1.08rem/1.6 var(--sans); }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 22px 60px; }
  h1 { font: 700 clamp(2.3rem, 6vw, 3.4rem)/1.05 var(--pixel); margin: 52px 0 10px; }
  .lede { color: var(--muted); margin: 0 0 30px; font-size: 1.2rem; }
  .news { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 0 20px; padding: 26px 0; border-top: 2px dashed var(--line); }
  .news canvas { image-rendering: pixelated; grid-row: span 3; justify-self: center; margin-top: 4px; }
  .news header { font: 700 1.5rem/1.2 var(--pixel); }
  .news header a { text-decoration: none; }
  .news header a:hover { text-decoration: underline; }
  .news header span { font: 700 .8rem/1 var(--sans); color: var(--ink); background: var(--c, #e3e7ef); padding: 4px 8px; border-radius: 6px; margin-left: 8px; vertical-align: 4px; }
  .news p { margin: 6px 0 0; color: var(--ink); font-weight: 700; }
  .news ul { margin: 8px 0 0; padding-left: 1.2em; color: var(--muted); }
  .news li { margin: 6px 0; }
  .news li b { color: var(--ink); }
  .news code { font: .9em var(--mono); background: var(--card); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; }
  .tip { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 14px 18px; margin-top: 30px; color: var(--muted); }
  .tip b { color: var(--ink); }
  @media (max-width: 560px) { .news { grid-template-columns: 1fr; } .news canvas { grid-row: auto; justify-self: start; margin-bottom: 8px; } }
</style>
</head>
<body>
<main class="wrap">
  <h1>What's new</h1>
  <p class="lede">The latest version of every app, newest news first.</p>
  <div id="news">{{news}}</div>
  <p class="tip"><b>Getting the new versions:</b> open <b>pca</b> and it updates everything by itself. Or type an app's name, then <b>update</b>, like <b>tidy update</b>.</p>
</main>
<script>
{{art}}
(function () {
  const COLOURS = { gossip: '#7cc4ff', tot: '#8fd16a', pigeon: '#2bc4b2', tidy: '#e8913a', den: '#f0843c', scout: '#7c9cff', roomy: '#ff7a59', hey: '#f2c14e', morph: '#d39cf5', pca: '#d9d4e8' };
  const PCA = { grid: ['GG.TT.PP.HH', 'GG.TT.PP.HH', '...........', 'KKKKKKKKKKK', 'K.........K', 'K.>.......K', 'KKKKKKKKKKK'], ink: { G: '#7cc4ff', T: '#8fd16a', P: '#2bc4b2', H: '#e8913a', K: '#1a1d29', '>': '#1a1d29' } };
  document.querySelectorAll('.news').forEach((el) => {
    const id = el.dataset.app;
    el.style.setProperty('--c', COLOURS[id] || '#e3e7ef');
    const m = id === 'pca' ? PCA : ART.mascots[id];
    if (!m) return;
    const c = document.createElement('canvas');
    c.setAttribute('aria-hidden', 'true');
    el.prepend(c);
    drawPixels(c, id === 'pca' ? m.grid : trimGrid(m.grid), m.ink, 3);
  });
})();
</script>
</body>
</html>
