<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nothing here - djp7</title>
<style>
  .lost { min-height: calc(100svh - 140px); display: grid; place-items: center; text-align: center; padding: 40px 0; }
  .lost canvas { display: block; margin: 0 auto 26px; }
  .lost h1 { font: 700 clamp(2rem, 5vw, 3rem)/1.1 var(--pixel); margin: 0 0 12px; }
  .lost p { color: var(--muted); margin: 0 auto; max-width: 30em; font-size: 1.12rem; }
  .lost p + p { margin-top: 22px; }
</style>
</head>
<body>
<main class="wrap lost">
  <div>
    <canvas id="owl" aria-hidden="true"></canvas>
    <h1>Nothing lives at this address</h1>
    <p>Pip looked everywhere. Pick an app from the dock at the bottom, or just start typing what you want to do.</p>
    <p><a class="btn" href="/">Go to the front page</a></p>
  </div>
</main>
<script>
{{art}}
(function () {
  const m = ART.mascots.scout;
  if (m) drawPixels(document.getElementById('owl'), trimGrid(m.grid), m.ink, 7);
})();
</script>
</body>
</html>
